<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音のC/D比デモ</title>
<style>
/* Layout: 上バー（タイトル・設定・開始）→ 一言の指示 → カメラ｜メーター＋0に合わせる → 音の上がり方・目を閉じる。実験用の設定と記録は「設定」の中 */
:root{
  --bg:#f1f4f7; --surface:#ffffff; --fg:#141b24; --muted:#5f6a7a; --line:#d9dee6; --faint:#f3f5f8;
  --h:#1f6f8b; --h-soft:#e3f0f5; --p:#c2611f; --p-soft:#fbeee4; --ok:#2e7d4f; --ok-soft:#e5f3eb;
  --f:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1217; --surface:#171d25; --fg:#e8ecf1; --muted:#97a1b1; --line:#2b3340; --faint:#1d242e;
  --h:#5fb6d3; --h-soft:#15303a; --p:#f19a5c; --p-soft:#3a2617; --ok:#6ccb93; --ok-soft:#163323; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--h);outline-offset:2px;border-radius:8px}
svg{display:block}
h1{margin:0}
[hidden]{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 44px minmax(0,1fr) auto;gap:10px;
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;min-height:0}

/* top bar */
.top{display:flex;align-items:center;gap:10px;min-width:0}
.top h1{font-size:15px;font-weight:700;white-space:nowrap;margin-right:auto}
.modes{display:flex;align-items:center;gap:8px;min-width:0}
.seg{display:flex;background:var(--faint);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;min-width:0}
.seg button{flex:1 1 0;min-width:0;padding:5px 10px;border-radius:8px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.modes .seg button{flex:1 0 auto;text-overflow:clip}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 2px #0002}
.run{min-width:5.5em;padding:7px 14px;border-radius:10px;background:var(--h);color:#fff;font-weight:700;text-align:center;white-space:nowrap}
.run.on{background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:6px 13px}
.btn{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;font-weight:700;white-space:nowrap;text-align:center}
#gear{color:var(--muted);font-weight:400}
#gear[aria-expanded="true"]{background:var(--fg);color:var(--surface)}
.btn:active,.run:active{transform:scale(.98)}

/* instruction bar: fixed height, one line */
.bar{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:12px;background:var(--fg);color:var(--surface);min-width:0;overflow:hidden}
.bar.ok{background:var(--ok);color:#fff}
.bar.err{background:var(--p);color:#fff}
.bar .ring{flex:none;width:24px;height:24px}
.bar .msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .msg b{font-size:17px}
.bar .msg span{font-size:12.5px;opacity:.75;margin-left:10px}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;min-height:0}
.main.nocam{grid-template-columns:minmax(0,1fr)}
.main.set{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 300px}
.main.nocam.set{grid-template-columns:minmax(0,1fr) 300px}
.main.nocam #campanel{display:none}
.main:not(.set) #controls{display:none}
.foot{display:grid;grid-template-columns:auto minmax(0,560px) auto;align-items:center;justify-content:center;gap:10px 14px}
.foot .name{display:flex;flex-direction:column;font-weight:700;white-space:nowrap}
.foot #eye{display:flex;align-items:center;gap:6px;height:100%;min-height:48px;padding:0 16px}
#eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#eye[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.logh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.logh .btn{padding:2px 8px;font-size:12px;border-radius:7px}
.logs{max-height:170px;overflow:auto}
table.log{width:100%;border-collapse:collapse;font-size:12px}
table.log th{position:sticky;top:0;background:var(--surface);font-weight:400;color:var(--muted);text-align:right;padding:2px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.log td{text-align:right;padding:2px 4px;border-bottom:1px solid var(--faint);white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.log th:nth-child(2),table.log td:nth-child(2){text-align:left}
.cam{position:relative;display:flex;flex-direction:column;overflow:hidden;padding:8px;gap:6px}
.camwrap{position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;background:#000}
.camwrap video,.camwrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.camwrap.mirror video,.camwrap.mirror canvas{transform:scaleX(-1)}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff9;font-size:13px}
.idle .ph{font-size:72px;color:#fff;cursor:pointer}
.idle .ph:hover{color:var(--h)}
.lost{position:absolute;top:8px;left:8px;background:#000c;color:#fff;border-radius:99px;padding:3px 10px;font-size:12px}
.flip{position:absolute;top:8px;right:8px;background:#000a;color:#fff;border-radius:99px;padding:4px 10px;font-size:12px}
.stage{position:relative;overflow:hidden;padding:8px;display:flex;flex-direction:column;gap:6px}
.stage > svg{width:100%;flex:1;min-height:0}
/* 0に合わせる：メーターの真下。押すと数える→止まると帯が満ちる。ずれたら光る */
.zero{position:relative;z-index:1;flex:none;height:46px;border-radius:12px;border:2px solid var(--h);color:var(--h);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden;background:var(--surface)}
.zero:hover{background:var(--h-soft)}
.zero svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.zero:active{transform:scale(.99)}
.zero:disabled{border-color:var(--line);color:var(--muted);background:var(--surface);cursor:default;opacity:.6}
.zero.wait{background:linear-gradient(90deg,var(--h) calc(var(--z,0)*100%),var(--h-soft) 0)}
.zero.wait #zerot{background:var(--surface);color:var(--h);padding:0 12px;border-radius:99px}
.zero.wait svg,.zero.wait kbd{display:none}
.zero.drift{border-color:var(--p);background:var(--p);color:#fff;animation:zp 1s ease-in-out infinite}
@keyframes zp{50%{box-shadow:inset 0 0 0 3px #fff9}}
@media (prefers-reduced-motion:reduce){.zero.drift{animation:none}}
@media (pointer:coarse){.zero kbd{display:none}}
.blind{position:absolute;inset:0;background:var(--fg);color:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;font-weight:700;font-size:16px}

/* controls */
.ctl{padding:12px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.ctl #setx{display:none}
.grp{display:flex;flex-direction:column;gap:5px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.lbl b{color:var(--fg);font-size:13px}
.gv{color:var(--p);font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.gains{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.gain{border:1px solid var(--line);border-radius:12px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;line-height:1.3;color:var(--muted);background:var(--surface)}
.gain svg{width:48px;height:30px;fill:none;stroke-linecap:round}
.gain[aria-pressed="true"]{font-weight:700;border-color:var(--p);background:var(--p-soft);color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
.gains.hide .gain{border-color:var(--line)!important;background:var(--surface)!important;color:inherit!important;box-shadow:none!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slrow{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:10px;align-items:center;height:28px}
input[type=range]{width:100%;margin:0;accent-color:var(--p);height:24px}
.fld{width:100%;height:28px;padding:0 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:13px;min-width:0}
input.fld{font-family:var(--mono);font-weight:700;text-align:right}
.fld:focus-visible{outline:2px solid var(--h);outline-offset:1px}
.fld:disabled{opacity:.45}
.edrow{height:26px;display:flex;align-items:center;gap:6px}
.edrow .lnk{font-size:12px;color:var(--h);text-decoration:underline;text-underline-offset:2px}
.edrow input{flex:1;min-width:0;height:26px;font-size:12.5px;text-align:left;font-weight:400}
.edrow .btn{padding:0 8px;height:26px;font-size:12px;border-radius:7px}
.row2s{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kb{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:11px;color:var(--muted)}
.kb span{white-space:nowrap}
kbd{display:inline-block;min-width:18px;padding:0 4px;border-radius:4px;border:1px solid var(--line);border-bottom-width:2px;background:var(--faint);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--fg);text-align:center;margin-right:2px;line-height:16px}
@media (pointer:coarse){.kb{display:none}}

/* phone */
@media (max-width:760px){
  .app{gap:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .top{flex-wrap:wrap;gap:6px 8px}
  .modes{order:3;flex:1 0 100%}
  .modes .seg{flex:1}
  .bar .msg b{font-size:15px}
  .main,.main.set{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,.8fr) minmax(0,1fr);gap:8px}
  .main.nocam,.main.nocam.set{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .cam,.stage{padding:4px}
  .foot{grid-template-columns:minmax(0,1fr) auto;gap:6px 8px}
  .foot .gains{grid-column:1/-1;order:3;gap:5px}
  .foot #eye{min-height:40px}
  .foot .name{flex-direction:row;gap:8px;align-items:baseline}
  .main.set #controls{position:fixed;inset:0;z-index:5;border-radius:0;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
  .ctl #setx{display:block}
}
@media (max-width:760px) and (max-height:700px){
  .main,.main.set{grid-template-rows:minmax(0,.42fr) minmax(0,1fr)}
  .zero{height:38px}
  .gain svg{height:20px}
  .foot #eye{min-height:32px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>音のC/D比デモ</h1>
    <div class="modes" id="modes">
      <div class="seg" role="group" aria-label="測り方">
        <button type="button" data-mode="cam" aria-pressed="true">カメラ</button>
        <button type="button" data-mode="above" aria-pressed="false">置いたスマホ</button>
        <button type="button" data-mode="phone" aria-pressed="false">センサー</button>
      </div>
    </div>
    <button type="button" class="btn" id="gear" aria-expanded="false" aria-controls="controls">設定</button>
    <button type="button" class="run" id="run">開始</button>
  </div>

  <div class="bar" id="banner" aria-live="polite">
    <svg class="ring" viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="5"/>
      <circle id="ring" cx="25" cy="25" r="21" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="132" transform="rotate(-90 25 25)"/></svg>
    <div class="msg"><b id="btitle"></b><span id="bsub"></span></div>
  </div>

  <div class="main idle" id="live">
    <div class="card cam" id="campanel">
      <div class="camwrap" id="camwrap">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="ph" id="camph">▶</div>
        <div class="lost" id="lost" hidden>手が写っていません</div>
        <button type="button" class="flip" id="flip" hidden>前／後ろ</button>
      </div>
    </div>

    <div class="card stage" id="stagepanel">
      <svg id="stage" viewBox="0 0 360 392" preserveAspectRatio="xMidYMax meet" role="img" aria-label="手の高さと音の高さのメーター">
        <text x="80" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="var(--h)">手の高さ</text>
        <text x="280" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="var(--p)">音の高さ</text>
        <rect x="58" y="34" width="44" height="296" rx="22" fill="var(--faint)" stroke="var(--line)"/>
        <rect x="258" y="34" width="44" height="296" rx="22" fill="var(--faint)" stroke="var(--line)"/>
        <g id="hticks"></g>
        <line id="goal" x1="50" x2="110" stroke="var(--h)" stroke-width="2.5" stroke-dasharray="5 5"/>
        <rect id="hfill" x="58" y="330" width="44" height="0" rx="22" fill="var(--h)" opacity=".16"/>
        <rect id="pfill" x="258" y="330" width="44" height="0" rx="22" fill="var(--p)" opacity=".16"/>
        <line id="link" x1="104" y1="330" x2="256" y2="330" stroke="var(--p)" stroke-width="3" opacity=".7"/>
        <g id="hmark" transform="translate(80,330)">
          <rect x="-24" y="-17" width="48" height="34" rx="7" fill="var(--h)"/>
          <path d="M-11 -1h22" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
        </g>
        <g id="pmark" transform="translate(280,330)">
          <circle r="20" fill="var(--p)"/>
          <path d="M-3 7V-9l9 -2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="-6.5" cy="7.5" r="4" fill="#fff"/>
        </g>
        <text x="80" y="376" text-anchor="middle" font-size="13" fill="var(--muted)"><tspan id="hval" font-family="var(--mono)" font-size="28" font-weight="700" fill="var(--h)">0</tspan> cm</text>
        <text x="280" y="376" text-anchor="middle" font-size="13" fill="var(--muted)"><tspan id="pval" font-family="var(--mono)" font-size="28" font-weight="700" fill="var(--p)">0</tspan> 半音</text>
        <g id="speaker" transform="translate(180,362)" opacity=".25">
          <path d="M-12 -5h5l7-6v22l-7-6h-5z" fill="var(--fg)"/>
          <path d="M5 -4a6 6 0 0 1 0 12M9 -8a11 11 0 0 1 0 20" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linecap="round"/>
        </g>
      </svg>
      <button type="button" class="zero" id="zero" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21h16M12 3v13M7 11l5 5 5-5"/></svg><span id="zerot">0に合わせる</span><kbd>Space</kbd></button>
      <div class="blind" id="blind" hidden><span>目を閉じて、音だけで比べる</span></div>
    </div>

    <div class="card ctl" id="controls">
      <button type="button" class="btn" id="setx">閉じる</button>
      <div class="grp">
        <div class="lbl"><b>ゲイン（半音/cm）</b></div>
        <div class="slrow"><input type="range" id="gslide" min="0" max="1" step="0.01" value="0.2" aria-label="ゲイン スライダー"><input type="number" class="fld" id="gnum" min="0" max="1" step="0.01" value="0.2" inputmode="decimal" aria-label="ゲイン 数値"></div>
        <div class="edrow" id="edrow"><button type="button" class="lnk" id="edopen">プリセット編集</button></div>
      </div>
      <div class="row2s">
        <div class="grp"><div class="lbl"><b>基準の音</b></div>
          <select class="fld" id="f0" aria-label="基準の音の高さ"><option value="220">220 Hz</option><option value="330">330 Hz</option><option value="440" selected>440 Hz</option><option value="660">660 Hz</option><option value="880">880 Hz</option></select></div>
        <div class="grp"><div class="lbl"><b>音程の上限</b></div>
          <select class="fld" id="clamp" aria-label="音程変化の上限"><option value="12">±12 半音</option><option value="24">±24 半音</option><option value="36" selected>±36 半音</option></select></div>
      </div>
      <div class="grp">
        <div class="lbl"><b>向き</b></div>
        <div class="seg" role="group" aria-label="音の向き">
          <button type="button" data-dir="1" aria-pressed="true">上げると高く</button>
          <button type="button" data-dir="-1" aria-pressed="false">上げると低く</button>
        </div>
      </div>
      <div class="grp">
        <div class="lbl"><b>鳴らし方</b></div>
        <div class="seg" role="group" aria-label="鳴らし方">
          <button type="button" data-snd="moving" aria-pressed="true">動く間</button>
          <button type="button" data-snd="always" aria-pressed="false">ずっと</button>
        </div>
      </div>
      <div class="grp">
        <div class="logh"><b id="logt">記録 0回</b><span style="display:flex;gap:6px"><button type="button" class="btn" id="copy">CSVをコピー</button><button type="button" class="btn" id="clear">消去</button></span></div>
        <div class="logs"><table class="log"><thead><tr><th>#</th><th>測り方</th><th>ゲイン</th><th>向き</th><th>最大cm</th><th>秒</th></tr></thead><tbody id="logb"></tbody></table></div>
      </div>
      <div class="kb keyhelp" aria-label="キーボード操作"></div>
    </div>
  </div>

  <div class="foot">
    <div class="name"><span>音の上がり方</span><span class="gv num" id="gv"></span></div>
    <div class="gains" id="gains" role="group" aria-label="音の上がり方（ゲイン）"></div>
    <button type="button" class="btn" id="eye" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10c2 3 5.5 5 9 5s7-2 9-5M5 13.5 3.5 16M19 13.5l1.5 2.5M9.5 15 9 18M14.5 15l.5 3"/></svg><span id="eyetext">目を閉じる</span></button>
  </div>
</div>

<script type="module">
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const MAXCM = 80, GOAL = 60;   // メーターの上限と目安 [cm]
const DEF_PRESETS = [0.05, 0.1, 0.2, 0.3, 0.4];   // 最大 0.4×80=32半音：上限36に当たらない
let goalCm = GOAL, reach = Infinity;   // カメラに写る範囲が狭いときは目安を下げる
const MODE = { cam: "カメラ", above: "置いたスマホ", phone: "センサー" };
const TOUCH = matchMedia("(pointer:coarse)").matches;
const S = { mode: "cam", aboveFacing: "user", facing: TOUCH ? "environment" : "user", gain: 0.2, dir: 1, snd: "moving", blind: false, running: false, hidden: false, f0: 440, maxst: 36 };
const $ = id => document.getElementById(id);

let h = 0, moving = false, gateUntil = 0, zeroed = false;
let lifts = 0, peak = 0, zeroProgress = 0, errMsg = "";

/* ---------- gain: presets / slider / number ---------- */
const r2 = x => Math.round(x * 100) / 100;
const fmtG = g => String(r2(g));
let PRESETS = DEF_PRESETS.slice();
try{
  const sv = JSON.parse(localStorage.getItem("cdw_presets") || "null");
  if(Array.isArray(sv) && sv.length === 5 && sv.every(v => typeof v === "number" && v >= 0 && v <= 1)) PRESETS = sv.map(r2).sort((a, b) => a - b);
}catch(_){}
function buildPresets(){
  const box = $("gains"); box.innerHTML = "";
  PRESETS.forEach((g, i) => {
    const b = document.createElement("button");
    const d = 22 * g / Math.max(0.01, PRESETS[4]), y = S.dir > 0 ? 26 - d : 4 + d, y0 = S.dir > 0 ? 26 : 4;
    b.type = "button"; b.className = "gain"; b.setAttribute("aria-label", "ゲイン " + fmtG(g));
    b.innerHTML = `<svg viewBox="0 0 48 30" aria-hidden="true"><path d="M5 ${y0}h38" stroke="var(--line)" stroke-width="2"/><path d="M5 ${y0}L43 ${y}" stroke="var(--p)" stroke-width="4"/></svg>${fmtG(g)}`;
    b.onclick = () => setGain(g, false);
    box.appendChild(b);

let ctx = null, osc = null, amp = null;

  trackLift(now);
  const st = Math.max(-S.maxst, Math.min(S.maxst, S.dir * S.gain * h));
  const on = S.running && zeroed && (S.snd === "always" || moving || now < gateUntil);
  if(ctx){ const t = ctx.currentTime; osc.frequency.setTargetAtTime(S.f0 * Math.pow(2, st / 12), t, 0.012); amp.gain.setTargetAtTime(on ? 0.2 : 0, t, on ? 0.02 : 0.07); }

let zeroNow = () => {};

function rezero(delay, speak){

}

const drifted = now => driftT > 0 && now - driftT > 600;
function renderZero(now){
  const b = $("zero"), can = S.running && !errMsg && !!(cs || ph), wait = can && !zeroed, left = Math.ceil((zeroFrom - now) / 1000);
  b.disabled = !can;
  b.classList.toggle("wait", wait); b.classList.toggle("drift", can && zeroed && drifted(now));
  b.style.setProperty("--z", wait ? Math.max(0, Math.min(1, zeroProgress)).toFixed(3) : 0);

/* ---------- camera ---------- */
let stream = null, landmarker = null, camRaf = 0, cs = null;
async function startCam(){
  applyLayout();

  const facing = above ? S.aboveFacing : S.facing;
  $("camph").textContent = "カメラを準備しています…";
  try{ stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 960 }, height: { ideal: 720 }, facingMode: facing }, audio: false }); }
  catch(e){ $("camph").textContent = ""; showErr("カメラを使えません。ブラウザでカメラを許可してください"); return; }
  $("camwrap").classList.toggle("mirror", facing === "user");
  const video = $("video"); video.srcObject = stream; await video.play();
  $("camph").textContent = landmarker ? "" : "手の検出を読み込み中…";
  if(!landmarker){
    try{
      const vision = await import(MP + "/vision_bundle.mjs");
      const fs = await vision.FilesetResolver.forVisionTasks(MP + "/wasm");
      const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: "VIDEO", numHands: 1 });
      try{ landmarker = await vision.HandLandmarker.createFromOptions(fs, opts("GPU")); }
      catch(_){ landmarker = await vision.HandLandmarker.createFromOptions(fs, opts("CPU")); }
    }catch(e){ $("camph").textContent = ""; showErr("手の検出を読み込めません。通信を確認して開き直してください"); return; }
  }
  if(!stream) return;
  $("camph").textContent = "";
  cs = { y0: null, k: null, y: null, palm: null, d: null, d0: null, hist: [], seen: 0, vt: -1, ph: 0, pt: 0 };
  zeroed = false; lastGuide = "";
  zeroNow = () => {
    if(!cs) return;
    if(S.mode === "above"){ if(cs.d == null) return; cs.d0 = cs.d; }
    else { if(cs.y == null) return; cs.y0 = cs.y; cs.k = 9.5 / cs.palm; }
    // カメラに写る高さから、届く範囲と目安を決める
    reach = S.mode === "above" ? Infinity : (cs.y0 - cs.palm * 0.6) * cs.k;
    goalCm = Math.max(20, Math.min(GOAL, Math.floor(reach * 0.9 / 10) * 10)); drawTicks();
    zeroed = true; h = 0; peak = 0; zeroDone();
  };

}
function camLoop(){
  const video = $("video"), cv = $("overlay"), c = cv.getContext("2d");

  const step = () => {
    if(!stream || !cs) return;
    const W = video.videoWidth, H = video.videoHeight;
    if(W && video.currentTime !== cs.vt){
      cs.vt = video.currentTime;
      if(cv.width !== W){ cv.width = W; cv.height = H; }
      const now = performance.now();
      const res = landmarker.detectForVideo(video, now);
      const lm = res.landmarks?.[0], wl = res.worldLandmarks?.[0];
      const above = S.mode === "above";
      c.clearRect(0, 0, W, H);
      if(lm){
        cs.seen = now;
        const PALM = [0, 1, 5, 9, 13, 17];
        let cx = 0, cy = 0; PALM.forEach(i => { cx += lm[i].x; cy += lm[i].y; }); cx = cx / PALM.length * W; cy = cy / PALM.length * H;
        const palm = Math.hypot((lm[0].x - lm[9].x) * W, (lm[0].y - lm[9].y) * H);
        cs.y = cs.y == null ? cy : cs.y + 0.55 * (cy - cs.y);
        cs.palm = cs.palm ? cs.palm + 0.1 * (palm - cs.palm) : palm;
        if(above && wl){
          // 写った手の大きさ（px）と実寸の手の形（m）を比べて、カメラからの距離を出す
          let wx = 0, wy = 0; PALM.forEach(i => { wx += wl[i].x; wy += wl[i].y; }); wx /= PALM.length; wy /= PALM.length;
          let si = 0, sw = 0;
          PALM.forEach(i => { si += Math.hypot(lm[i].x * W - cx, lm[i].y * H - cy); sw += Math.hypot(wl[i].x - wx, wl[i].y - wy); });
          if(sw > 0 && si > 0){
            const f = 0.74 * Math.max(W, H);   // 一般的なスマホカメラの画角（約70度）を仮定
            const d = f * sw / si;            // m
            cs.d = cs.d == null ? d : cs.d + 0.4 * (d - cs.d);
          }
        }
        const q = above ? (cs.d == null ? null : cs.d * 100) : cs.y;
        if(!zeroed){
          if(q != null && now < zeroFrom){ cs.hist = []; zeroProgress = 0; }
          else if(q != null){
            cs.hist.push({ t: now, y: q }); while(now - cs.hist[0].t > 1000) cs.hist.shift();
            const ys = cs.hist.map(p => p.y), span = Math.max(...ys) - Math.min(...ys);
            const still = above ? span < 0.8 : span < cs.palm * 0.06;
            if(!still) cs.hist = cs.hist.slice(-1);
            zeroProgress = still ? (now - cs.hist[0].t) / 1000 : 0;
            if(still && zeroProgress >= 0.95) zeroNow();
          }
        } else {
          const raw = above ? (cs.d - cs.d0) * 100 : (cs.y0 - cs.y) * cs.k;
          h = Math.max(0, raw);
          driftT = raw < (above ? -5 : -2.5) ? driftT || now : 0;   // 手が0より下にいる＝0がずれている
          const dt = (now - cs.pt) / 1000;
          if(dt > 0){ moving = Math.abs(h - cs.ph) / dt > 4; if(moving) gateUntil = now + 180; }
          cs.ph = h; cs.pt = now;

            c.beginPath(); c.moveTo(0, cs.y0); c.lineTo(W, cs.y0); c.stroke();
            const gy = cs.y0 - goalCm / cs.k; c.strokeStyle = "#fff"; c.lineWidth = 3; c.setLineDash([4, 12]); c.beginPath(); c.moveTo(0, gy); c.lineTo(W, gy); c.stroke(); c.setLineDash([]);
          }
        }
        if(above && cs.d != null){
          c.save(); if($("camwrap").classList.contains("mirror")){ c.translate(W, 0); c.scale(-1, 1); }
          c.font = "bold 34px system-ui"; c.fillStyle = "#fff"; c.strokeStyle = "#000"; c.lineWidth = 5;
          const tx = "距離 " + Math.round(cs.d * 100) + " cm"; c.strokeText(tx, 16, 46); c.fillText(tx, 16, 46); c.restore();
        }
        c.fillStyle = accent; c.beginPath(); c.arc(cx, cy, 16, 0, Math.PI * 2); c.fill();
        c.strokeStyle = "#fff"; c.lineWidth = 3; c.stroke();
        if(!zeroed){   // 手のまわりの輪が満ちたら0
          c.lineCap = "round"; c.lineWidth = 8; c.strokeStyle = "#fff6"; c.beginPath(); c.arc(cx, cy, 36, 0, Math.PI * 2); c.stroke();
          if(zeroProgress > 0){ c.strokeStyle = "#6ccb93"; c.beginPath(); c.arc(cx, cy, 36, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, zeroProgress)); c.stroke(); }
        }
      }
      const lost = now - cs.seen > 400;
      $("lost").hidden = !lost; $("lost").textContent = zeroed && h > 15 ? "カメラの外です" : "手が写っていません";
      if(lost){ moving = false; driftT = 0; cs.hist = []; if(!zeroed) zeroProgress = 0; }
    }
    camRaf = requestAnimationFrame(step);
  };
  step();
}
$("flip").onclick = () => {
  if(S.mode === "above") S.aboveFacing = S.aboveFacing === "user" ? "environment" : "user";
  else S.facing = S.facing === "user" ? "environment" : "user";
  stopAll(); begin();
};

/* ---------- phone sensor ---------- */
let ph = null;
function startPhone(){
  applyLayout();
  zeroed = false; h = 0; lastGuide = "";
  ph = { v: 0, lastT: null, g: null, win: [], segStart: 0, wasStill: true, stillSince: performance.now() };
  zeroNow = () => { h = 0; if(ph) ph.v = 0; zeroed = true; peak = 0; zeroDone(); };
  zeroFrom = 0; zeroSay = false;
  const DME = window.DeviceMotionEvent;
  if(!DME){ showErr("このブラウザでは動きのセンサーが使えません。「カメラ」を選んでください"); return; }
  const attach = () => window.addEventListener("devicemotion", onMotion);
  if(typeof DME.requestPermission === "function"){
    DME.requestPermission().then(r => r === "granted" ? attach() : showErr("動きのセンサーが許可されませんでした")).catch(() => showErr("動きのセンサーの許可に失敗しました"));
  } else attach();
}
function onMotion(e){
  const aig = e.accelerationIncludingGravity; if(!aig || aig.x == null || !ph) return;
  const now = performance.now(), g = [aig.x, aig.y, aig.z];
  if(ph.lastT === null){ ph.lastT = now; ph.g = g.slice(); return; }
  const dt = (now - ph.lastT) / 1000; ph.lastT = now; if(dt <= 0 || dt > 0.1) return;
  const k = 1 - Math.exp(-dt / 0.6); for(let i = 0; i < 3; i++) ph.g[i] += k * (g[i] - ph.g[i]);
  const gm = Math.hypot(...ph.g) || 9.81, u = ph.g.map(x => x / gm);
  const acc = e.acceleration;
  const aUp = (acc && acc.x != null) ? acc.x * u[0] + acc.y * u[1] + acc.z * u[2] : g[0] * u[0] + g[1] * u[1] + g[2] * u[2] - gm;
  ph.win.push({ t: now, a: Math.abs(aUp) }); while(now - ph.win[0].t > 250) ph.win.shift();
  const still = Math.max(...ph.win.map(w => w.a)) < 0.2;
  if(still){
    if(!ph.wasStill){ if(h - ph.segStart < -3) h = 0; ph.stillSince = now; }
    ph.v = 0;
    if(!zeroed){ zeroProgress = (now - Math.max(ph.stillSince, zeroFrom)) / 700; if(zeroProgress >= 1) zeroNow(); }
  } else {
    if(ph.wasStill) ph.segStart = h;
    const a = Math.abs(aUp) < 0.05 ? 0 : aUp;
    ph.v += a * dt; ph.v *= (1 - 0.3 * dt); h += ph.v * dt * 100;
    if(h < 0){ h = 0; if(ph.v < 0) ph.v = 0; } if(h > 120) h = 120; if(!zeroed) h = 0;
    if(!zeroed){ ph.stillSince = now; zeroProgress = 0; }
  }
  ph.wasStill = still;
  moving = !still && Math.abs(ph.v) > 0.03; if(moving) gateUntil = now + 150;
}

/* ---------- flow ---------- */
function stopAll(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  cancelAnimationFrame(camRaf);
  $("video").srcObject = null; $("lost").hidden = true;
  const cv = $("overlay"); cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
  $("camph").textContent = "▶"; $("flip").hidden = true;
  window.removeEventListener("devicemotion", onMotion); ph = null; cs = null; driftT = 0; zeroFrom = 0; zeroSay = false;
  zeroed = false; h = 0; moving = false; lifts = 0; peak = 0; zeroProgress = 0; errMsg = "";
  zeroNow = () => {}; lastGuide = ""; lift = null; goalCm = GOAL; reach = Infinity; drawTicks();
}
function begin(){
  errMsg = "";
  if(S.mode === "cam" || S.mode === "above") startCam();
  else startPhone();
}
function setRun(on){
  S.running = on; $("live").classList.toggle("idle", !on); $("run").textContent = on ? "停止" : "開始"; $("run").classList.toggle("on", on);
  if(!on) idleBar();
}
function start(){ initAudio(); setRun(true); begin(); }
function stop(){ stopAll(); setRun(false); }
$("run").onclick = () => S.running ? stop() : start();
// 測り方の切り替え（動作中なら、そのクリックで新しい方法を開始＝ユーザー操作として許可を求められる）
function settings(on){ $("live").classList.toggle("set", on); $("gear").setAttribute("aria-expanded", String(on)); }
$("gear").onclick = () => settings(!$("live").classList.contains("set"));
$("setx").onclick = () => settings(false);
if(!TOUCH) $("modes").hidden = true;   // PCはカメラだけ
const modeBtns = document.querySelectorAll("[data-mode]");
function selectMode(m){
  modeBtns.forEach(o => o.setAttribute("aria-pressed", o.dataset.mode === m ? "true" : "false"));
  if(S.running){ stopAll(); S.mode = m; initAudio(); begin(); }
  else { S.mode = m; applyLayout(); }
}
modeBtns.forEach(b => b.onclick = () => selectMode(b.dataset.mode));
$("camph").onclick = () => { if(!S.running) start(); }; applyLayout(); idleBar();
</script>
</body>
</html>
