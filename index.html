<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auditory C/D ratio</title>
<style>
:root{
  --bg:#f4f4f2; --surface:#ffffff; --fg:#161616; --muted:#6a6a6a; --line:#cfcfcb; --faint:#f0f0ed; --acc:#1c4f9c; --on-acc:#fff;
  --f:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101010; --surface:#181818; --fg:#e6e6e3; --muted:#9a9a96; --line:#3a3a38; --faint:#202020; --acc:#78aaf0; --on-acc:#0b0b0b; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:13px;line-height:1.4}
button,select{font:inherit;color:inherit;border-radius:3px;touch-action:manipulation}
button{cursor:pointer;background:var(--surface);border:1px solid var(--line);padding:0 10px;height:26px;white-space:nowrap}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
select{height:28px;border:1px solid var(--line);background:var(--surface);padding:0 6px}
h1{margin:0}
[hidden]{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 26px minmax(0,1fr);gap:8px;
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:10px;min-width:0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.top h1{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.top label{color:var(--muted);font-size:12px}
.run{width:64px;height:28px;font-weight:600;background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.run.on{background:var(--surface);color:var(--fg);border-color:var(--fg)}
.status{border:1px solid var(--line);background:var(--surface);padding:0 10px;line-height:24px;height:26px;font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grid{display:grid;grid-template-columns:228px minmax(0,1fr) 372px;gap:8px;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.panel{background:var(--surface);border:1px solid var(--line);min-width:0;min-height:0;display:flex;flex-direction:column}
.pt{flex:none;height:24px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);white-space:nowrap}
.pt .lg{display:flex;gap:10px}
.sw{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:4px}

/* parameters */
.row{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)}
.row > span:first-child{color:var(--muted);font-size:12px;white-space:nowrap}
.row.stack{grid-template-columns:minmax(0,1fr);gap:5px}
.row .lh{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.row .lh b{font-weight:400;color:var(--fg)}
.seg{display:flex;min-width:0}
.seg button{flex:1 1 0;min-width:0;padding:0 4px;border-radius:0;margin-left:-1px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
.seg button:first-child{margin-left:0;border-radius:3px 0 0 3px}
.seg button:last-child{border-radius:0 3px 3px 0}
.seg.t button{font-family:var(--f)}
.seg.hide button[aria-pressed]{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.keys{width:100%;border-collapse:collapse;font-size:11px}
.keys td{padding:2px 8px;border-top:1px solid var(--line);white-space:nowrap}
.keys td:first-child{width:92px}
.keys td:last-child{color:var(--muted)}
kbd{display:inline-block;min-width:17px;padding:0 3px;margin-right:2px;border:1px solid var(--line);border-radius:2px;font-family:var(--mono);font-size:10.5px;line-height:15px;text-align:center;color:var(--fg)}
@media (pointer:coarse){.keysbox{display:none}}

/* center */
.center{position:relative}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{padding:5px 10px 6px;border-right:1px solid var(--line);min-width:0}
.cell:last-child{border-right:0}
.cell small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.cell .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;line-height:28px;white-space:nowrap;overflow:hidden}
.plot{position:relative;flex:1;min-height:0}
.plot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pmap{flex:none;height:196px}
.blind{position:absolute;inset:0;background:#000;color:#d8d8d8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}
.blind b{font-family:var(--mono);font-size:20px;font-weight:400;letter-spacing:.4em;padding-left:.4em}
.blind .keys td{border-color:#333}
.blind .keys td:last-child{color:#999}
.blind kbd{border-color:#555;color:#d8d8d8}

/* camera + log */
.cam{flex:none;height:222px}
.camwrap{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
.camwrap video,.camwrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.camwrap.mirror video,.camwrap.mirror canvas{transform:scaleX(-1)}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-family:var(--mono);font-size:12px}
.lost{position:absolute;top:6px;left:6px;background:#000c;color:#fff;border:1px solid #888;padding:1px 6px;font-size:11px;font-family:var(--mono)}
.pt button{height:19px;font-size:11px;padding:0 6px}
.logp{flex:1}
.logscroll{flex:1;min-height:0;overflow:auto}
table.log{width:100%;border-collapse:collapse;font-size:11.5px}
table.log th{position:sticky;top:0;background:var(--faint);font-weight:400;color:var(--muted);text-align:right;padding:3px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
table.log td{text-align:right;padding:2px 5px;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.log th:nth-child(2),table.log td:nth-child(2){text-align:left}

@media (max-width:760px){
  .app{height:auto;min-height:100dvh;grid-template-rows:auto 26px auto;gap:6px}
  .top{flex-wrap:wrap;gap:6px 8px;padding-bottom:6px}
  .top h1{flex:1 0 100%}
  .top .sp{flex:1}
  .grid{grid-template-columns:minmax(0,1fr);gap:6px}
  .col{gap:6px}
  .cell .v{font-size:17px;line-height:22px}
  .cell{padding:4px 6px 5px}
  .plot.ts{height:168px;flex:none}
  .pmap{height:176px}
  .cam{height:210px}
  .logp{max-height:230px}
  .logscroll{max-height:200px}
  .row{padding:5px 8px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Auditory C/D ratio — pseudo-weight prototype</h1>
    <label for="method">手法</label>
    <select id="method">
      <option value="cam">カメラ</option>
      <option value="above">置いたスマホ</option>
      <option value="phone">センサー</option>
      <option value="demo">デモ</option>
    </select>
    <button type="button" class="run" id="run">開始</button>
  </header>

  <div class="status" id="status" aria-live="polite">待機</div>

  <div class="grid" id="live">
    <div class="col">
      <section class="panel">
        <div class="pt"><span>パラメータ</span></div>
        <div class="row stack">
          <div class="lh"><span>g [st/cm]</span><b class="num" id="gv">0.2</b></div>
          <div class="seg" id="gains" role="group" aria-label="g"></div>
        </div>
        <div class="row"><span>方向</span>
          <div class="seg t" role="group" aria-label="方向">
            <button type="button" data-dir="1" aria-pressed="true" title="Δp = +g·h">+</button>
            <button type="button" data-dir="-1" aria-pressed="false" title="Δp = −g·h">−</button>
          </div></div>
        <div class="row"><span>発音</span>
          <div class="seg t" role="group" aria-label="発音条件">
            <button type="button" data-snd="moving" aria-pressed="true">移動時</button>
            <button type="button" data-snd="always" aria-pressed="false">常時</button>
          </div></div>
        <div class="row"><span>f₀</span><span class="num">440 Hz</span></div>
        <div class="btns">
          <button type="button" id="zero">ゼロ点設定</button>
          <button type="button" id="eye" aria-pressed="false">ブラインド</button>
        </div>
      </section>
      <section class="panel keysbox">
        <div class="pt"><span>キー</span></div>
        <table class="keys keyhelp"></table>
      </section>
    </div>

    <div class="col center" id="center">
      <section class="panel">
        <div class="strip">
          <div class="cell"><small>h [cm]</small><div class="v" id="rh">0.0</div></div>
          <div class="cell"><small>Δp [st]</small><div class="v" id="rp">+0.00</div></div>
          <div class="cell"><small>f [Hz]</small><div class="v" id="rf">440.0</div></div>
          <div class="cell"><small>状態</small><div class="v" id="rs">停止</div></div>
        </div>
      </section>
      <section class="panel" style="flex:1">
        <div class="pt"><span>h(t), Δp(t)</span><span class="lg"><span><i class="sw" style="background:var(--fg)"></i>h</span><span><i class="sw" style="background:var(--acc)"></i>Δp</span></span></div>
        <div class="plot ts"><canvas id="ts"></canvas></div>
      </section>
      <section class="panel pmap">
        <div class="pt"><span>Δp = g·h</span></div>
        <div class="plot"><canvas id="map"></canvas></div>
      </section>
      <div class="blind" id="blind" hidden>
        <b>BLIND</b>
        <table class="keys keyhelp"></table>
      </div>
    </div>

    <div class="col">
      <section class="panel cam">
        <div class="pt"><span id="camt">カメラ</span><button type="button" id="flip" hidden>前/後</button></div>
        <div class="camwrap" id="camwrap">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="ph" id="camph">—</div>
          <div class="lost" id="lost" hidden>NO HAND</div>
        </div>
      </section>
      <section class="panel logp">
        <div class="pt"><span id="logt">試行ログ n=0</span><span class="lg"><button type="button" id="copy">CSVをコピー</button><button type="button" id="clear">消去</button></span></div>
        <div class="logscroll">
          <table class="log"><thead><tr><th>#</th><th>手法</th><th>g</th><th>方向</th><th>発音</th><th>h<sub>max</sub> [cm]</th><th>T [s]</th><th>時刻</th></tr></thead><tbody id="logb"></tbody></table>
        </div>
      </section>
    </div>
  </div>
</div>

<script type="module">
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const BASE = 440, MAXCM = 40, MAXST = 32, TW = 8;
const GAINS = [[0.05,"とても小"],[0.1,"小"],[0.2,"標準"],[0.4,"大"],[0.8,"とても大"]];
const MODE = { cam: "カメラ", above: "置きスマホ", phone: "センサー", demo: "デモ" };
const MONO = 'ui-monospace,Consolas,Menlo,monospace';
const TOUCH = matchMedia("(pointer:coarse)").matches;
const S = { mode: "cam", aboveFacing: "user", facing: TOUCH ? "environment" : "user", gain: 0.2, dir: 1, snd: "moving", blind: false, running: false, gi: 2, hidden: false };
const $ = id => document.getElementById(id);

let h = 0, moving = false, gateUntil = 0, zeroed = false;
let zeroProgress = 0, errMsg = "", note = "", lostFlag = false;
const sgn = v => v < 0 ? "−" : "+";

/* ---------- colors ---------- */
let C = {};
function loadColors(){
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  C = { fg: g("--fg"), muted: g("--muted"), line: g("--line"), acc: g("--acc"), surface: g("--surface") };
}
loadColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", loadColors);

/* ---------- controls ---------- */
GAINS.forEach(([g], gi) => {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("aria-pressed", g === S.gain ? "true" : "false"); b.textContent = String(g);
  b.onclick = () => setGain(gi, false, false);
  $("gains").appendChild(b);
});
function bindSeg(attr, key, parse){
  const btns = document.querySelectorAll(`[data-${attr}]`);
  btns.forEach(b => b.onclick = () => { S[key] = parse(b.dataset[attr]); btns.forEach(o => o.setAttribute("aria-pressed", o === b ? "true" : "false")); });
}
bindSeg("dir", "dir", x => parseInt(x, 10));
bindSeg("snd", "snd", x => x);
$("eye").onclick = () => {
  S.blind = !S.blind; $("eye").setAttribute("aria-pressed", S.blind ? "true" : "false");
  $("blind").hidden = !S.blind;
};
document.addEventListener("click", e => { const b = e.target.closest("button"); if(b) b.blur(); });

/* ---------- keyboard + voice ---------- */
const KEYS = [
  [["←","→"], "g −/+"], [["1","5"], "g 直接", "–"], [["Space"], "ゼロ点"], [["Enter"], "ブラインド"],
  [["R"], "g 乱数(非表示)"], [["A"], "g 開示"], [["D"], "方向"], [["M"], "発音条件"]
];
document.querySelectorAll(".keyhelp").forEach(el => {
  el.innerHTML = KEYS.map(([ks, t, sep]) => `<tr><td>${ks.map(k => `<kbd>${k}</kbd>`).join(sep || "")}</td><td>${t}</td></tr>`).join("");
});

let jaVoice = null;
function pickVoice(){ try{ jaVoice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)) || null; }catch(_){} }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function beep(n){
  if(!ctx) return;
  for(let i = 0; i < n; i++){
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.14;
    o.frequency.value = 1200; o.connect(g).connect(ctx.destination);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.12, t + 0.01); g.gain.linearRampToValueAtTime(0, t + 0.08);
    o.start(t); o.stop(t + 0.1);
  }
}
function say(text, fallbackBeeps = 1){
  if("speechSynthesis" in window){
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; u.rate = 1.15; if(jaVoice) u.voice = jaVoice;
      speechSynthesis.speak(u); return;
    }catch(_){}
  }
  beep(fallbackBeeps);
}
const gainName = i => `ゲイン${i + 1}、${GAINS[i][1]}`;
function setGain(i, announce, hidden){
  i = Math.max(0, Math.min(GAINS.length - 1, i));
  S.gi = i; S.gain = GAINS[i][0]; S.hidden = hidden;
  document.querySelectorAll("#gains button").forEach((o, k) => o.setAttribute("aria-pressed", k === i ? "true" : "false"));
  $("gains").classList.toggle("hide", hidden);
  $("gv").textContent = hidden ? "hidden" : String(GAINS[i][0]);
  if(announce) say(hidden ? "ランダム" : gainName(i), hidden ? 2 : i + 1);
}
function toggleBlind(){ $("eye").click(); say(S.blind ? "ブラインドモード" : "表示に戻しました"); }
function reveal(){ rows.forEach(r => { if(r.hidden) r.revealed = true; }); renderLog(); }
document.addEventListener("keydown", e => {
  if(!S.running || e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if(k === "ArrowRight" || k === "ArrowUp"){ setGain(S.hidden ? S.gi : S.gi + 1, true, false); }
  else if(k === "ArrowLeft" || k === "ArrowDown"){ setGain(S.hidden ? S.gi : S.gi - 1, true, false); }
  else if(/^[1-5]$/.test(k)){ setGain(parseInt(k, 10) - 1, true, false); }
  else if(k === " "){ zeroNow(); say("ゼロ"); }
  else if(k === "Enter"){ toggleBlind(); }
  else if(k === "r" || k === "R"){ let n; do{ n = Math.floor(Math.random() * GAINS.length); }while(GAINS.length > 1 && n === S.gi && Math.random() < 0.7); setGain(n, true, true); }
  else if(k === "a" || k === "A"){ say("答えは、" + gainName(S.gi), S.gi + 1); setGain(S.gi, false, false); reveal(); }
  else if(k === "d" || k === "D"){ document.querySelector(`[data-dir="${-S.dir}"]`).click(); say(S.dir > 0 ? "上げると高くなる" : "上げると低くなる"); }
  else if(k === "m" || k === "M"){ document.querySelector(`[data-snd="${S.snd === "moving" ? "always" : "moving"}"]`).click(); say(S.snd === "moving" ? "動いている間だけ" : "ずっと鳴らす"); }
  else return;
  e.preventDefault();
});

/* ---------- trial log ---------- */
const rows = [];
let lift = null;
const pad2 = n => String(n).padStart(2, "0");
const gCell = r => r.hidden && !r.revealed ? "hidden" : String(r.gain);
function logCells(r){
  const d = new Date(r.time);
  return [r.n, MODE[r.mode], gCell(r), r.dir > 0 ? "+" : "−", r.snd === "moving" ? "移動時" : "常時", r.peak.toFixed(1), r.dur.toFixed(2), `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`];
}
function renderLog(){
  $("logb").innerHTML = rows.slice().reverse().map(r => "<tr>" + logCells(r).map(c => `<td>${c}</td>`).join("") + "</tr>").join("");
  $("logt").textContent = "試行ログ n=" + rows.length;
}
function trackLift(now){
  if(!(S.running && zeroed)){ lift = null; return; }
  if(!lift){
    if(h > 5) lift = { t0: now, peak: h, mode: S.mode, gain: S.gain, hidden: S.hidden, dir: S.dir, snd: S.snd };
    return;
  }
  lift.peak = Math.max(lift.peak, h);
  if(h < 2){
    const dur = (now - lift.t0) / 1000;
    if(dur >= 0.3){
      rows.push({ n: rows.length + 1, mode: lift.mode, gain: lift.gain, hidden: lift.hidden, revealed: false, dir: lift.dir, snd: lift.snd, peak: lift.peak, dur, time: Date.now() });
      renderLog();
    }
    lift = null;
  }
}
$("clear").onclick = () => { rows.length = 0; renderLog(); };
$("copy").onclick = async () => {
  const head = ["trial", "method", "g_st_per_cm", "direction", "sound", "peak_h_cm", "duration_s", "time"];
  const csv = [head, ...rows.map(r => { const c = logCells(r); c[3] = r.dir > 0 ? "+" : "-"; return c; })].map(a => a.join(",")).join("\n");
  let ok = false;
  try{ await navigator.clipboard.writeText(csv); ok = true; }
  catch(_){
    try{
      const ta = document.createElement("textarea"); ta.value = csv; ta.style.cssText = "position:fixed;left:-9999px;top:0";
      document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
    }catch(__){}
  }
  const b = $("copy"); b.textContent = ok ? "コピー済" : "失敗";
  setTimeout(() => { b.textContent = "CSVをコピー"; }, 1200);
};

/* ---------- plots ---------- */
const hist = [];
function fit(cv){
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  const w = Math.round(r.width * d), ht = Math.round(r.height * d);
  if(cv.width !== w || cv.height !== ht){ cv.width = w; cv.height = ht; }
  const c = cv.getContext("2d"); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, r.width, r.height);
  c.font = `10px ${MONO}`; return [c, r.width, r.height];
}
const stLabel = v => (v === 0 ? "" : S.dir > 0 ? "+" : "−") + v;
function frame(c, x0, y0, x1, y1){
  c.strokeStyle = C.line; c.lineWidth = 1; c.strokeRect(Math.round(x0) + .5, Math.round(y1) + .5, Math.round(x1 - x0), Math.round(y0 - y1));
}
function drawTS(now){
  const [c, W, H] = fit($("ts")); if(W < 60) return;
  const L = 34, R = 40, T = 16, B = 20, x0 = L, x1 = W - R, y0 = H - B, y1 = T;
  c.fillStyle = C.muted; c.textBaseline = "middle";
  c.textAlign = "right"; c.fillText("cm", x0 - 4, 7);
  c.textAlign = "left"; c.fillText("st", x1 + 4, 7);
  c.lineWidth = 1;
  for(let i = 0; i <= 4; i++){
    const y = Math.round(y0 - (y0 - y1) * i / 4) + .5;
    c.strokeStyle = C.line; c.globalAlpha = i === 0 || i === 4 ? 1 : .5; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); c.globalAlpha = 1;
    c.textAlign = "right"; c.fillStyle = C.fg; c.fillText(String(i * MAXCM / 4), x0 - 4, y);
    c.textAlign = "left"; c.fillStyle = C.acc; c.fillText(stLabel(i * MAXST / 4), x1 + 4, y);
  }
  c.fillStyle = C.muted; c.textBaseline = "alphabetic";
  for(let s = 0; s <= TW; s += 2){
    const x = Math.round(x0 + (x1 - x0) * s / TW) + .5;
    c.strokeStyle = C.line; c.globalAlpha = s === 0 || s === TW ? 1 : .5; c.beginPath(); c.moveTo(x, y1); c.lineTo(x, y0); c.stroke(); c.globalAlpha = 1;
    c.textAlign = s === 0 ? "left" : s === TW ? "right" : "center"; c.fillText(s === TW ? "0" : "−" + (TW - s), x, y0 + 13);
  }
  c.textAlign = "right"; c.fillText("t [s]", W - 2, H - 3 - 0);
  frame(c, x0, y0, x1, y1);
  c.save(); c.beginPath(); c.rect(x0, y1, x1 - x0, y0 - y1); c.clip();
  const X = t => x1 - (now - t) / 1000 / TW * (x1 - x0);
  const series = (key, scale, color) => {
    c.strokeStyle = color; c.lineWidth = 1.5; c.beginPath(); let pen = false;
    for(const p of hist){
      const v = p[key]; if(v == null){ pen = false; continue; }
      const x = X(p.t), y = y0 - Math.min(1, v / scale) * (y0 - y1);
      if(pen) c.lineTo(x, y); else { c.moveTo(x, y); pen = true; }
    }
    c.stroke();
  };
  series("h", MAXCM, C.fg); series("p", MAXST, C.acc);
  c.restore();
}
function drawMap(st){
  const [c, W, H] = fit($("map")); if(W < 60) return;
  const L = 40, R = 16, T = 16, B = 20, x0 = L, x1 = W - R, y0 = H - B, y1 = T;
  const X = v => x0 + v / MAXCM * (x1 - x0), Y = v => y0 - Math.min(MAXST, v) / MAXST * (y0 - y1);
  c.fillStyle = C.muted; c.textBaseline = "middle"; c.textAlign = "left"; c.fillText("st", 4, 7);
  c.lineWidth = 1;
  for(let v = 0; v <= MAXST; v += 8){
    const y = Math.round(Y(v)) + .5;
    c.strokeStyle = C.line; c.globalAlpha = v === 0 || v === MAXST ? 1 : .5; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); c.globalAlpha = 1;
    c.textAlign = "right"; c.fillStyle = C.acc; c.fillText(stLabel(v), x0 - 4, y);
  }
  c.textBaseline = "alphabetic";
  for(let v = 0; v <= MAXCM; v += 10){
    const x = Math.round(X(v)) + .5;
    c.strokeStyle = C.line; c.globalAlpha = v === 0 || v === MAXCM ? 1 : .5; c.beginPath(); c.moveTo(x, y1); c.lineTo(x, y0); c.stroke(); c.globalAlpha = 1;
    c.textAlign = v === 0 ? "left" : v === MAXCM ? "right" : "center"; c.fillStyle = C.fg; c.fillText(String(v), x, y0 + 13);
  }
  c.textAlign = "left"; c.fillStyle = C.muted; c.fillText("h [cm]", 2, H - 3);
  frame(c, x0, y0, x1, y1);
  if(S.hidden){ c.textAlign = "center"; c.textBaseline = "middle"; c.fillStyle = C.muted; c.fillText("g: hidden", (x0 + x1) / 2, (y0 + y1) / 2); return; }
  c.save(); c.beginPath(); c.rect(x0, y1, x1 - x0, y0 - y1); c.clip();
  c.strokeStyle = C.acc; c.lineWidth = 1.5; c.beginPath(); c.moveTo(X(0), Y(0)); c.lineTo(X(MAXCM), Y(S.gain * MAXCM)); c.stroke();
  const px = X(Math.min(MAXCM, h)), py = Y(Math.abs(st));
  c.strokeStyle = C.muted; c.lineWidth = 1; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(px, y0); c.lineTo(px, py); c.lineTo(x0, py); c.stroke(); c.setLineDash([]);
  c.fillStyle = C.surface; c.strokeStyle = C.fg; c.lineWidth = 1.5; c.fillRect(px - 3.5, py - 3.5, 7, 7); c.strokeRect(px - 3.5, py - 3.5, 7, 7);
  c.restore();
}

/* ---------- readouts + status ---------- */
const cache = {};
function setText(id, v){ if(cache[id] !== v){ cache[id] = v; $(id).textContent = v; } }
function statusText(){
  if(errMsg) return "エラー: " + errMsg;
  if(!S.running) return "待機";
  if(note) return note;
  if(!zeroed) return `ゼロ点校正中 ${Math.round(Math.min(1, zeroProgress) * 100)}%`;
  if(lostFlag) return "手を検出できません";
  if(S.blind) return "ブラインド";
  return "計測中";
}

/* ---------- audio ---------- */
let ctx = null, osc = null, amp = null;
function initAudio(){
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  if(!ctx){ ctx = new AC(); osc = ctx.createOscillator(); osc.type = "sine"; osc.frequency.value = BASE;
    amp = ctx.createGain(); amp.gain.value = 0; osc.connect(amp).connect(ctx.destination); osc.start(); }
  if(ctx.state === "suspended") ctx.resume();
}
function tick(){
  const now = performance.now();
  if(S.mode === "demo" && S.running) demoStep(now);
  trackLift(now);
  const st = Math.max(-36, Math.min(36, S.dir * S.gain * h));
  const on = S.running && zeroed && (S.snd === "always" || moving || now < gateUntil);
  if(ctx){ const t = ctx.currentTime; osc.frequency.setTargetAtTime(BASE * Math.pow(2, st / 12), t, 0.012); amp.gain.setTargetAtTime(on ? 0.2 : 0, t, on ? 0.02 : 0.07); }
  if(S.running) hist.push({ t: now, h, p: S.hidden ? null : Math.abs(st) });
  while(hist.length && now - hist[0].t > TW * 1000 + 500) hist.shift();
  setText("rh", h.toFixed(1));
  setText("rp", S.hidden ? "—" : sgn(st) + Math.abs(st).toFixed(2));
  setText("rf", S.hidden ? "—" : (BASE * Math.pow(2, st / 12)).toFixed(1));
  setText("rs", !S.running ? "停止" : !zeroed ? "校正" : on ? "発音" : "無音");
  setText("status", statusText());
  drawTS(now); drawMap(st);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

let zeroNow = () => {};
$("zero").onclick = () => zeroNow();
const showErr = m => { errMsg = m; };

/* ---------- layout per mode ---------- */
function applyLayout(){
  const cam = S.mode === "cam" || S.mode === "above";
  $("flip").hidden = !TOUCH || !cam;
  $("camt").textContent = cam ? "カメラ" + (S.mode === "above" ? " (上向き)" : "") : "カメラ (未使用)";
  idlePh();
}
function idlePh(){ $("camph").textContent = (S.mode === "cam" || S.mode === "above") ? "—" : "未使用"; }

/* ---------- demo ---------- */
let demoT0 = 0;
function demoStep(now){
  const t = ((now - demoT0) / 1000) % 4.6;
  const e = x => 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, x)));
  const prev = h;
  h = t < 0.5 ? 0 : t < 2.0 ? 30 * e((t - 0.5) / 1.5) : t < 2.8 ? 30 : t < 4.0 ? 30 * (1 - e((t - 2.8) / 1.2)) : 0;
  moving = Math.abs(h - prev) > 0.05; if(moving) gateUntil = now + 120;
}

/* ---------- camera ---------- */
let stream = null, landmarker = null, camRaf = 0, cs = null;
async function startCam(){
  applyLayout();
  const above = S.mode === "above";
  const facing = above ? S.aboveFacing : S.facing;
  note = "カメラ初期化中";
  try{ stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: facing }, audio: false }); }
  catch(e){ note = ""; showErr("カメラ使用不可（許可を確認）"); return; }
  $("camwrap").classList.toggle("mirror", facing === "user");
  const video = $("video"); video.srcObject = stream; await video.play();
  $("camph").textContent = "";
  if(!landmarker){
    note = "モデル読込中";
    try{
      const vision = await import(MP + "/vision_bundle.mjs");
      const fs = await vision.FilesetResolver.forVisionTasks(MP + "/wasm");
      const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: "VIDEO", numHands: 1 });
      try{ landmarker = await vision.HandLandmarker.createFromOptions(fs, opts("GPU")); }
      catch(_){ landmarker = await vision.HandLandmarker.createFromOptions(fs, opts("CPU")); }
    }catch(e){ note = ""; showErr("手検出モデルの読込失敗"); return; }
  }
  if(!stream) return;
  note = "";
  cs = { y0: null, k: null, y: null, palm: null, d: null, d0: null, hist: [], seen: 0, vt: -1, ph: 0, pt: 0 };
  zeroed = false;
  zeroNow = () => {
    if(!cs) return;
    if(S.mode === "above"){ if(cs.d == null) return; cs.d0 = cs.d; }
    else { if(cs.y == null) return; cs.y0 = cs.y; cs.k = 9.5 / cs.palm; }
    zeroed = true; h = 0;
  };
  camLoop();
}
function camLoop(){
  const video = $("video"), cv = $("overlay"), c = cv.getContext("2d");
  const step = () => {
    if(!stream) return;
    const W = video.videoWidth, H = video.videoHeight;
    if(W && video.currentTime !== cs.vt){
      cs.vt = video.currentTime;
      if(cv.width !== W){ cv.width = W; cv.height = H; }
      const now = performance.now();
      const res = landmarker.detectForVideo(video, now);
      const lm = res.landmarks?.[0], wl = res.worldLandmarks?.[0];
      const above = S.mode === "above";
      c.clearRect(0, 0, W, H);
      if(lm){
        cs.seen = now;
        const PALM = [0, 1, 5, 9, 13, 17];
        let cx = 0, cy = 0; PALM.forEach(i => { cx += lm[i].x; cy += lm[i].y; }); cx = cx / PALM.length * W; cy = cy / PALM.length * H;
        const palm = Math.hypot((lm[0].x - lm[9].x) * W, (lm[0].y - lm[9].y) * H);
        cs.y = cs.y == null ? cy : cs.y + 0.55 * (cy - cs.y);
        cs.palm = cs.palm ? cs.palm + 0.1 * (palm - cs.palm) : palm;
        if(above && wl){
          // 写った手の大きさ（px）と実寸の手の形（m）を比べて、カメラからの距離を出す
          let wx = 0, wy = 0; PALM.forEach(i => { wx += wl[i].x; wy += wl[i].y; }); wx /= PALM.length; wy /= PALM.length;
          let si = 0, sw = 0;
          PALM.forEach(i => { si += Math.hypot(lm[i].x * W - cx, lm[i].y * H - cy); sw += Math.hypot(wl[i].x - wx, wl[i].y - wy); });
          if(sw > 0 && si > 0){
            const f = 0.74 * Math.max(W, H);   // 一般的なスマホカメラの画角（約70度）を仮定
            const d = f * sw / si;            // m
            cs.d = cs.d == null ? d : cs.d + 0.4 * (d - cs.d);
          }
        }
        const q = above ? (cs.d == null ? null : cs.d * 100) : cs.y;
        if(!zeroed){
          if(q != null){
            cs.hist.push({ t: now, y: q }); while(now - cs.hist[0].t > 1000) cs.hist.shift();
            const ys = cs.hist.map(p => p.y), span = Math.max(...ys) - Math.min(...ys);
            const still = above ? span < 0.8 : span < cs.palm * 0.06;
            if(!still) cs.hist = cs.hist.slice(-1);
            zeroProgress = still ? (now - cs.hist[0].t) / 1000 : 0;
            if(still && zeroProgress >= 0.95) zeroNow();
          }
        } else {
          h = above ? Math.max(0, (cs.d - cs.d0) * 100) : Math.max(0, (cs.y0 - cs.y) * cs.k);
          const dt = (now - cs.pt) / 1000;
          if(dt > 0){ moving = Math.abs(h - cs.ph) / dt > 4; if(moving) gateUntil = now + 180; }
          cs.ph = h; cs.pt = now;
          if(!above){
            c.strokeStyle = C.acc; c.lineWidth = 3; c.setLineDash([14, 10]);
            c.beginPath(); c.moveTo(0, cs.y0); c.lineTo(W, cs.y0); c.stroke(); c.setLineDash([]);
          }
        }
        if(above && cs.d != null){
          c.save(); if($("camwrap").classList.contains("mirror")){ c.translate(W, 0); c.scale(-1, 1); }
          c.font = "bold 30px ui-monospace,Consolas,monospace"; c.fillStyle = "#fff"; c.strokeStyle = "#000"; c.lineWidth = 5;
          const tx = "d = " + Math.round(cs.d * 100) + " cm"; c.strokeText(tx, 16, 44); c.fillText(tx, 16, 44); c.restore();
        }
        c.fillStyle = C.acc; c.fillRect(cx - 9, cy - 9, 18, 18);
        c.strokeStyle = "#fff"; c.lineWidth = 3; c.strokeRect(cx - 9, cy - 9, 18, 18);
      }
      lostFlag = now - cs.seen > 400;
      $("lost").hidden = !lostFlag;
      if(lostFlag){ moving = false; if(!zeroed) zeroProgress = 0; }
    }
    camRaf = requestAnimationFrame(step);
  };
  step();
}
$("flip").onclick = () => {
  if(S.mode === "above") S.aboveFacing = S.aboveFacing === "user" ? "environment" : "user";
  else S.facing = S.facing === "user" ? "environment" : "user";
  stopAll(); begin();
};

/* ---------- phone sensor ---------- */
let ph = null;
function startPhone(){
  applyLayout();
  zeroed = false; h = 0;
  ph = { v: 0, lastT: null, g: null, win: [], segStart: 0, wasStill: true, stillSince: performance.now() };
  zeroNow = () => { h = 0; if(ph) ph.v = 0; zeroed = true; };
  const DME = window.DeviceMotionEvent;
  if(!DME){ showErr("DeviceMotion 非対応"); return; }
  const attach = () => window.addEventListener("devicemotion", onMotion);
  if(typeof DME.requestPermission === "function"){
    DME.requestPermission().then(r => r === "granted" ? attach() : showErr("センサー権限なし")).catch(() => showErr("センサー権限の取得失敗"));
  } else attach();
}
function onMotion(e){
  const aig = e.accelerationIncludingGravity; if(!aig || aig.x == null || !ph) return;
  const now = performance.now(), g = [aig.x, aig.y, aig.z];
  if(ph.lastT === null){ ph.lastT = now; ph.g = g.slice(); return; }
  const dt = (now - ph.lastT) / 1000; ph.lastT = now; if(dt <= 0 || dt > 0.1) return;
  const k = 1 - Math.exp(-dt / 0.6); for(let i = 0; i < 3; i++) ph.g[i] += k * (g[i] - ph.g[i]);
  const gm = Math.hypot(...ph.g) || 9.81, u = ph.g.map(x => x / gm);
  const acc = e.acceleration;
  const aUp = (acc && acc.x != null) ? acc.x * u[0] + acc.y * u[1] + acc.z * u[2] : g[0] * u[0] + g[1] * u[1] + g[2] * u[2] - gm;
  ph.win.push({ t: now, a: Math.abs(aUp) }); while(now - ph.win[0].t > 250) ph.win.shift();
  const still = Math.max(...ph.win.map(w => w.a)) < 0.2;
  if(still){
    if(!ph.wasStill){ if(h - ph.segStart < -3) h = 0; ph.stillSince = now; }
    ph.v = 0;
    if(!zeroed){ zeroProgress = (now - ph.stillSince) / 700; if(zeroProgress >= 1) zeroNow(); }
  } else {
    if(ph.wasStill) ph.segStart = h;
    const a = Math.abs(aUp) < 0.05 ? 0 : aUp;
    ph.v += a * dt; ph.v *= (1 - 0.3 * dt); h += ph.v * dt * 100;
    if(h < 0){ h = 0; if(ph.v < 0) ph.v = 0; } if(h > 80) h = 80;
    if(!zeroed){ ph.stillSince = now; zeroProgress = 0; }
  }
  ph.wasStill = still;
  moving = !still && Math.abs(ph.v) > 0.03; if(moving) gateUntil = now + 150;
}

/* ---------- flow ---------- */
function stopAll(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  cancelAnimationFrame(camRaf);
  $("video").srcObject = null; $("lost").hidden = true;
  const cv = $("overlay"); cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
  idlePh();
  window.removeEventListener("devicemotion", onMotion); ph = null;
  zeroed = false; h = 0; moving = false; zeroProgress = 0; errMsg = ""; note = ""; lostFlag = false; lift = null;
  zeroNow = () => {};
}
function begin(){
  errMsg = "";
  if(S.mode === "cam" || S.mode === "above") startCam();
  else if(S.mode === "phone") startPhone();
  else { applyLayout(); zeroed = true; demoT0 = performance.now(); }
}
function setRun(on){
  S.running = on; $("run").textContent = on ? "停止" : "開始"; $("run").classList.toggle("on", on);
}
function start(){ initAudio(); setRun(true); begin(); }
function stop(){ stopAll(); setRun(false); }
$("run").onclick = () => S.running ? stop() : start();
// 手法の切り替え（動作中なら、その操作で新しい手法を開始＝ユーザー操作として許可を求められる）
function selectMode(m){
  $("method").value = m;
  if(S.running){ stopAll(); S.mode = m; initAudio(); begin(); }
  else { S.mode = m; applyLayout(); }
}
$("method").onchange = e => selectMode(e.target.value);
applyLayout();
if(location.hash === "#demo"){ selectMode("demo"); start(); }
</script>
</body>
</html>
