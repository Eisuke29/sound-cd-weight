<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音のC/D比デモ</title>
<style>
/* Layout: 上＝動かし方 → 中央＝舞台（ものさし・箱 〜弦〜 音符・鍵盤） → 下＝ゲインの絵カード。設定と記録は右の引き出し。
   色の約束: 青＝手・箱（高さ） / 橙＝音。説明文の代わりに、つかめる形・点線の行き先・矢印・揺れで次の動作を示す */
:root{
  --bg:#f1f4f7; --surface:#ffffff; --fg:#141b24; --muted:#5f6a7a; --line:#d9dee6; --faint:#f3f5f8;
  --h:#1f6f8b; --p:#c2611f; --p-soft:#fbeee4; --ok:#2e7d4f; --on:#ffffff; --ivory:#ffffff; --ebony:#39424f;
  --f:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1217; --surface:#171d25; --fg:#e8ecf1; --muted:#97a1b1; --line:#2b3340; --faint:#1d242e;
  --h:#5fb6d3; --p:#f19a5c; --p-soft:#3a2617; --ok:#6ccb93; --on:#0e1217; --ivory:#c9d0d9; --ebony:#1d242e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--h);outline-offset:2px}
svg{display:block}
h1,h2{margin:0}
[hidden]{display:none!important}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}

/* top */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.top h1{font-size:14px;font-weight:700;white-space:nowrap}
.modes{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.mode{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:72px;padding:6px 8px 4px;border-radius:12px;color:var(--muted);font-size:11px;line-height:1.35}
.mode:hover{background:var(--faint)}
.mode[aria-pressed="true"]{background:var(--h);color:var(--on);font-weight:700}
.tools{display:flex;justify-content:flex-end;gap:4px}
.tool{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.tool:hover{background:var(--surface);color:var(--fg)}
.tool[aria-pressed="true"],.tool[aria-expanded="true"]{background:var(--fg);color:var(--surface)}
.tool .b,.tool[aria-pressed="true"] .a{display:none}
.tool[aria-pressed="true"] .b{display:block}
.tool.call{color:var(--p);animation:beat 1.1s ease-in-out infinite}

/* main */
.main{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-height:0}
.main.cam{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.main:not(.cam) #campanel{display:none}
.panel{position:relative;min-width:0;min-height:0;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
#campanel{background:#000;border-color:#000}
.camwrap{position:absolute;inset:0}
.camwrap video,.camwrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.camwrap.mirror video,.camwrap.mirror canvas{transform:scaleX(-1)}
.camwrap video{transition:opacity .25s}
.camwrap.lost video{opacity:.35}
.find{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;color:#fff;font-size:13px;pointer-events:none}
.find .ic{width:84px;height:84px;stroke-width:1.3;stroke-dasharray:2.6 2;animation:beat 1.4s ease-in-out infinite}
.flip{position:absolute;top:10px;right:10px;width:44px;height:44px;display:grid;place-items:center;background:#000a;color:#fff;border-radius:99px}
#stage{touch-action:none;position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:3px 14px;border-radius:99px;background:var(--faint);font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none}
.hint.err{background:var(--p);color:var(--on);white-space:normal;border-radius:12px;text-align:center;width:max-content}
.zero{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--muted);font-size:12px;white-space:nowrap}
.zero:hover{color:var(--fg);border-color:var(--muted)}
.zero .ic{width:16px;height:16px}
.blind{position:absolute;inset:0;border-radius:20px;background:#10151c;color:#e8ecf1;display:grid;place-content:center;pointer-events:none;z-index:2}
.blind .ic{width:96px;height:96px;stroke-width:1.2}

/* stage parts */
#box,#knob{outline:none}
.grab #box{cursor:grab;touch-action:none}
.grab.held #box{cursor:grabbing}
#box:focus-visible .focus{stroke:var(--fg)}
#knob{cursor:ns-resize;touch-action:none}
#knob:focus-visible .kb{stroke:var(--fg);stroke-width:3}
#knob:hover .kb{fill:var(--p)}
#knob:hover .kg{stroke:var(--on)}
.chev path{fill:none;stroke:var(--h);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.15;animation:chev 1.2s infinite}
.chev path:nth-child(2){animation-delay:.18s}
.chev path:nth-child(3){animation-delay:.36s}
@keyframes chev{0%,70%,100%{opacity:.15}25%{opacity:.9}}
@keyframes beat{50%{transform:scale(1.06);opacity:.75}}

/* gain cards */
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,104px));gap:8px;justify-content:center}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 5px;border-radius:16px;background:var(--surface);border:2px solid var(--line);transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--p);transform:translateY(-2px)}
.card:active{transform:scale(.97)}
.card svg.g{width:56px;height:62px}
.card .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);line-height:1.3}
#quiz .n{font-family:var(--f)}
.card[aria-pressed="true"]{border-color:var(--p);background:var(--p-soft)}
.card[aria-pressed="true"] .n{color:var(--p);font-weight:700}
.card.next{animation:next 1.5s ease-in-out infinite}
.card.hit{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.card.miss{animation:miss .35s}
@keyframes next{50%{transform:translateY(-6px);border-color:var(--p)}}
@keyframes miss{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q{font-size:34px;font-weight:700;line-height:1;height:62px;display:grid;place-items:center;color:var(--muted)}
.card[aria-pressed="true"] .q{color:var(--p)}
.q .ic{width:34px;height:34px}

/* drawer */
.drawer{position:fixed;z-index:5;top:0;right:0;bottom:0;width:min(340px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px #0002;overflow:auto;overscroll-behavior:contain;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:16px}
.dh{display:flex;align-items:center;justify-content:space-between}
.drawer h2{font-size:14px}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12.5px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:2px solid var(--line);border-radius:12px;font-size:12px;color:var(--muted)}
.opt svg{width:72px;height:36px;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.opt[aria-pressed="true"]{border-color:var(--p);background:var(--p-soft);color:var(--fg);font-weight:700}
.slrow{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:10px;align-items:center}
input[type=range]{width:100%;margin:0;accent-color:var(--p);height:24px}
.fld{width:100%;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:13px;min-width:0}
.fld.bad{border-color:var(--p);box-shadow:0 0 0 1px var(--p)}
input.fld{font-family:var(--mono)}
.btn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.row{display:flex;gap:6px;align-items:center}
.row > .fld{flex:1}
.logs{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px}
table.log{width:100%;border-collapse:collapse;font-size:12px}
table.log th{position:sticky;top:0;background:var(--faint);font-weight:400;color:var(--muted);text-align:right;padding:3px 6px;white-space:nowrap}
table.log td{text-align:right;padding:3px 6px;border-top:1px solid var(--faint);white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.log th:nth-child(2),table.log td:nth-child(2){text-align:left}
.keys{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:5px 8px;font-size:12px;color:var(--muted);align-items:center}
kbd{min-width:20px;padding:0 5px;border-radius:5px;border:1px solid var(--line);border-bottom-width:2px;background:var(--faint);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--fg);text-align:center;line-height:17px;white-space:nowrap}
@media (pointer:coarse){.keyswrap{display:none}}

@media (max-width:760px){
  .app{gap:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .top{grid-template-columns:1fr auto;gap:4px 8px}
  .modes{grid-column:1/-1;order:3}
  .mode{flex:1;min-width:0;padding:5px 2px 3px}
  .main.cam{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,.8fr) minmax(0,1fr);gap:8px}
  .cards{grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
  .card{padding:6px 0 3px;border-radius:12px}
  .card svg.g{width:100%;max-width:46px;height:50px}
  .q{height:50px;font-size:26px}
}
@media (max-height:520px){.card svg.g{height:34px}.q{height:34px;font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.chev path{opacity:.7}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></symbol>
  <symbol id="i-lift" viewBox="0 0 24 24"><rect x="5" y="12" width="14" height="9" rx="2"/><path d="M12 8V2M8.5 5.5 12 2l3.5 3.5"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></symbol>
  <symbol id="i-above" viewBox="0 0 24 24"><rect x="3" y="18" width="18" height="4" rx="1.5"/><path d="M5 5h14M12 9v6M9 12l3-3 3 3"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="4" y="3" width="10" height="18" rx="2"/><path d="M19 16V8M16.5 10.5 19 8l2.5 2.5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-shut" viewBox="0 0 24 24"><path d="M3 10c2 3 5.5 5 9 5s7-2 9-5M5 13.5 3.5 16M19 13.5l1.5 2.5M9.5 15 9 18M14.5 15l.5 3"/></symbol>
  <symbol id="i-set" viewBox="0 0 24 24"><path d="M3 7h9M18 7h3M3 17h3M12 17h9"/><circle cx="15" cy="7" r="3"/><circle cx="9" cy="17" r="3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></symbol>
  <symbol id="i-zero" viewBox="0 0 24 24"><path d="M4 21h16M12 3v13M7.5 11.5 12 16l4.5-4.5"/></symbol>
</defs></svg>

<div class="app">
  <header class="top">
    <h1>音のC/D比</h1>
    <div class="modes" role="group" aria-label="動かし方">
      <button type="button" class="mode" data-mode="drag" aria-pressed="true"><svg class="ic"><use href="#i-lift"/></svg><span id="dragname">マウス</span></button>
      <button type="button" class="mode" data-mode="cam" aria-pressed="false"><svg class="ic"><use href="#i-cam"/></svg>カメラ</button>
      <button type="button" class="mode touch" data-mode="above" aria-pressed="false"><svg class="ic"><use href="#i-above"/></svg>かざす</button>
      <button type="button" class="mode touch" data-mode="phone" aria-pressed="false"><svg class="ic"><use href="#i-phone"/></svg>持つ</button>
      <button type="button" class="mode" data-mode="demo" aria-pressed="false"><svg class="ic"><use href="#i-play"/></svg>自動</button>
    </div>
    <div class="tools">
      <button type="button" class="tool" id="mute" aria-pressed="false" aria-label="音を消す" title="音を消す"><svg class="ic a"><use href="#i-vol"/></svg><svg class="ic b"><use href="#i-mute"/></svg></button>
      <button type="button" class="tool" id="eye" aria-pressed="false" aria-label="画面を隠す（目を閉じる）" title="画面を隠す"><svg class="ic a"><use href="#i-eye"/></svg><svg class="ic b"><use href="#i-shut"/></svg></button>
      <button type="button" class="tool" id="gear" aria-expanded="false" aria-controls="drawer" aria-label="設定と記録" title="設定と記録"><svg class="ic"><use href="#i-set"/></svg></button>
    </div>
  </header>

  <main class="main" id="live">
    <section class="panel" id="campanel" aria-label="カメラ">
      <div class="camwrap" id="camwrap">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="find" id="find"><svg class="ic"><use href="#i-hand"/></svg><span id="findt"></span></div>
      </div>
      <button type="button" class="flip" id="flip" aria-label="前と後ろのカメラを切り替える" hidden><svg class="ic"><use href="#i-swap"/></svg></button>
    </section>
    <section class="panel" id="stagepanel" aria-label="箱と音">
      <svg id="stage">
        <g id="ruler"></g>
        <g id="desk"></g>
        <g id="keys"></g>
        <line id="reach" stroke="var(--p)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" opacity=".5"/>
        <rect id="ghost" rx="10" fill="none" stroke="var(--h)" stroke-width="2.5" stroke-dasharray="7 7"/>
        <g class="chev" id="chev"><path d="M-16 8 0 -6 16 8"/><path d="M-16 -14 0 -28 16 -14"/><path d="M-16 -36 0 -50 16 -36"/></g>
        <path id="string" fill="none" stroke="var(--p)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        <g id="box" tabindex="0" role="slider" aria-label="箱の高さ（cm）" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0">
          <rect x="-70" y="-62" width="140" height="112" fill="transparent"/>
          <path d="M-20 -27v-9a9 9 0 0 1 9 -9h22a9 9 0 0 1 9 9v9" fill="none" stroke="var(--h)" stroke-width="7"/>
          <rect class="focus" x="-42" y="-28" width="84" height="56" rx="10" fill="var(--h)" stroke="transparent" stroke-width="3"/>
          <text id="hval" y="9" text-anchor="middle" font-family="var(--mono)" font-size="26" font-weight="700" fill="var(--on)">0</text>
          <rect id="zring" x="-52" y="-54" width="104" height="90" rx="18" fill="none" stroke="var(--ok)" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="0 101"/>
        </g>
        <g id="pmark">
          <circle r="22" fill="var(--p)"/>
          <path d="M-2 8V-10l9 -2" fill="none" stroke="var(--on)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="-6" cy="8" r="4.5" fill="var(--on)"/>
          <text id="pval" y="-30" text-anchor="middle" font-family="var(--mono)" font-size="15" font-weight="700" fill="var(--p)"></text>
        </g>
        <text id="qmark" text-anchor="middle" font-size="64" font-weight="700" fill="var(--p)">?</text>
        <g id="knob" tabindex="0" role="slider" aria-label="音の上がり幅（ゲイン）" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="1">
          <rect x="-8" y="-24" width="52" height="48" fill="transparent"/>
          <path class="kb" d="M0 0 12 -15H30a6 6 0 0 1 6 6V9a6 6 0 0 1 -6 6H12z" fill="var(--surface)" stroke="var(--p)" stroke-width="2.5" stroke-linejoin="round"/>
          <path class="kg" d="M18 -4l5 -5 5 5M18 4l5 5 5 -5" fill="none" stroke="var(--p)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
      <div class="hint" id="hint" role="status"></div>
      <button type="button" class="zero" id="zero" hidden><svg class="ic"><use href="#i-zero"/></svg>ここを0に</button>
    </section>
    <div class="blind" id="blind" hidden><svg class="ic"><use href="#i-shut"/></svg></div>
  </main>

  <div class="cards" id="cards" role="group" aria-label="音の上がり幅（ゲイン）"></div>
</div>

<aside class="drawer" id="drawer" aria-label="設定と記録" hidden>
  <div class="dh"><h2>設定</h2><button type="button" class="tool" id="shut" aria-label="閉じる"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="grp"><label class="lbl" for="gslide">ゲイン（半音/cm）</label>
    <div class="slrow"><input type="range" id="gslide" min="0" max="1" step="0.01" value="0.2"><input type="number" class="fld" id="gnum" min="0" max="1" step="0.01" value="0.2" inputmode="decimal" aria-label="ゲインの数値"></div></div>
  <div class="grp"><label class="lbl" for="edin">5枚のカードの値</label>
    <div class="row"><input class="fld" id="edin"><button type="button" class="btn" id="edrs">初期値</button></div></div>
  <div class="grp"><span class="lbl">向き</span><div class="pair" role="group" aria-label="向き">
    <button type="button" class="opt" data-dir="1" aria-pressed="true"><svg viewBox="0 0 72 36"><path d="M22 32V8M15 15l7-8 7 8" stroke="var(--h)"/><path d="M50 32V8M43 15l7-8 7 8" stroke="var(--p)"/></svg>上げると高く</button>
    <button type="button" class="opt" data-dir="-1" aria-pressed="false"><svg viewBox="0 0 72 36"><path d="M22 32V8M15 15l7-8 7 8" stroke="var(--h)"/><path d="M50 4v24M43 21l7 8 7-8" stroke="var(--p)"/></svg>上げると低く</button></div></div>
  <div class="grp"><span class="lbl">鳴らし方</span><div class="pair" role="group" aria-label="鳴らし方">
    <button type="button" class="opt" data-snd="moving" aria-pressed="true"><svg viewBox="0 0 72 36"><path d="M4 18h16q4-18 8 0t8 0 8 0 8 0h16" stroke="var(--p)"/></svg>動く間だけ</button>
    <button type="button" class="opt" data-snd="always" aria-pressed="false"><svg viewBox="0 0 72 36"><path d="M4 18q4-18 8 0t8 0 8 0 8 0 8 0 8 0 8 0 8 0" stroke="var(--p)"/></svg>ずっと</button></div></div>
  <div class="pair">
    <div class="grp"><label class="lbl" for="f0">最初の音</label><select class="fld" id="f0"><option value="220">220 Hz</option><option value="330">330 Hz</option><option value="440" selected>440 Hz</option><option value="660">660 Hz</option><option value="880">880 Hz</option></select></div>
    <div class="grp"><label class="lbl" for="clamp">音程の上限</label><select class="fld" id="clamp"><option value="12">±12 半音</option><option value="24" selected>±24 半音</option><option value="36">±36 半音</option></select></div>
  </div>
  <div class="grp"><div class="dh"><h2 id="logt">記録 0回</h2><div class="row"><button type="button" class="btn" id="copy">CSVをコピー</button><button type="button" class="btn" id="clear">消去</button></div></div>
    <div class="logs"><table class="log"><thead><tr><th>#</th><th>動かし方</th><th>ゲイン</th><th>向き</th><th>最大cm</th><th>秒</th></tr></thead><tbody id="logb"></tbody></table></div></div>
  <div class="grp keyswrap"><h2>キー</h2><div class="keys" id="keyhelp"></div></div>
</aside>

<script type="module">
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const MAXCM = 40, GOAL = 30;                 // ものさしの長さ / 点線の箱（行き先）の高さ [cm]
const DEF_PRESETS = [0.05, 0.1, 0.2, 0.4, 0.8];
const TOUCH = matchMedia("(pointer:coarse)").matches;
const CALM = matchMedia("(prefers-reduced-motion:reduce)").matches;
const MODE = { drag: TOUCH ? "指" : "マウス", cam: "カメラ", above: "かざす", phone: "持つ", demo: "自動" };
const S = { mode: "drag", aboveFacing: "user", facing: TOUCH ? "environment" : "user", gain: 0.2, dir: 1, snd: "moving", blind: false, mute: false, hidden: false, f0: 440, maxst: 24 };
const $ = id => document.getElementById(id);
const clampv = (x, a, b) => Math.max(a, Math.min(b, x));
$("dragname").textContent = MODE.drag;
if(!TOUCH) document.querySelectorAll(".mode.touch").forEach(b => { b.hidden = true; });   // PCで使えない動かし方は出さない

let h = 0, moving = false, gateUntil = 0, zeroed = true;
let lifts = 0, peak = 0, zeroProgress = 0, errMsg = "", busy = false, touched = false;

/* ---------- gain: cards / knob / numbers ---------- */
const r2 = x => Math.round(x * 100) / 100;
const fmtG = g => String(r2(g));
let PRESETS = DEF_PRESETS.slice();
try{
  const sv = JSON.parse(localStorage.getItem("cdw_presets") || "null");
  if(Array.isArray(sv) && sv.length === 5 && sv.every(v => typeof v === "number" && v >= 0 && v <= 1)) PRESETS = sv.map(r2).sort((a, b) => a - b);
}catch(_){}

// カードの絵：箱（青）はどれも同じだけ上がる。音（橙）の上がり方だけが違う
function cardSvg(g){
  const B = 53, T = 10, d = Math.min(1, GOAL * g / S.maxst) * (B - T);
  const y0 = S.dir > 0 ? B : T, y = S.dir > 0 ? B - d : T + d;
  return `<svg class="g" viewBox="0 0 56 62" aria-hidden="true"><path d="M17 ${B}V${T}" stroke="var(--h)" stroke-width="4" stroke-linecap="round" opacity=".35"/><rect x="9" y="${T - 7}" width="16" height="13" rx="3" fill="var(--h)"/>`
    + `<path d="M40 ${T}V${B}" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/><path d="M40 ${y0}V${y}" stroke="var(--p)" stroke-width="4" stroke-linecap="round" opacity=".55"/><circle cx="40" cy="${y}" r="7" fill="var(--p)"/></svg>`;
}
const gCards = () => document.querySelectorAll(".card.g");
function buildCards(){
  const box = $("cards"); box.innerHTML = "";
  PRESETS.forEach((g, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "card g"; b.setAttribute("aria-label", `ゲイン ${fmtG(g)} 半音/cm`);
    b.innerHTML = cardSvg(g) + `<span class="n">${fmtG(g)}</span>`;
    b.onclick = () => pick(i, false);
    box.appendChild(b);
  });
  const q = document.createElement("button");
  q.type = "button"; q.className = "card"; q.id = "quiz"; q.onclick = () => S.hidden ? reveal(false) : shuffle(false);
  box.appendChild(q);
  $("edin").value = PRESETS.join(", ");
  refreshGain();
}
let quizShown = null;
function refreshGain(){
  const hid = S.hidden, q = $("quiz");
  gCards().forEach((o, k) => o.setAttribute("aria-pressed", !hid && Math.abs(PRESETS[k] - S.gain) < 1e-6 ? "true" : "false"));
  if(quizShown !== q || q.getAttribute("aria-pressed") !== String(hid)){
    quizShown = q;
    q.setAttribute("aria-pressed", String(hid));
    q.setAttribute("aria-label", hid ? "答えを見る" : "カードを1枚隠して選ぶ");
    q.innerHTML = hid ? '<span class="q"><svg class="ic"><use href="#i-eye"/></svg></span><span class="n">答え</span>' : '<span class="q">?</span><span class="n">あてる</span>';
  }
  const sl = $("gslide"), nm = $("gnum");
  sl.disabled = nm.disabled = hid;
  sl.value = hid ? 0 : S.gain;
  if(document.activeElement !== nm) nm.value = hid ? "" : fmtG(S.gain);
  nm.placeholder = hid ? "?" : "";
}
function setGain(g, announce, hidden = false){
  S.gain = r2(clampv(+g || 0, 0, 1)); S.hidden = hidden;
  gCards().forEach(e => e.classList.remove("miss", "hit"));
  refreshGain();
  if(announce) say(hidden ? "ランダム" : "ゲイン" + fmtG(S.gain), 1);
}
function shuffle(announce){
  let g; do{ g = PRESETS[Math.floor(Math.random() * PRESETS.length)]; }while(g === S.gain && Math.random() < 0.7);
  lifts = 0; setGain(g, announce, true);
}
function reveal(announce){ setGain(S.gain, false); revealLog(); if(announce) say("答えは、ゲイン" + fmtG(S.gain), 1); }
// 隠しているときにカードを選ぶ＝「これだと思う」
function pick(i, announce){
  if(!S.hidden){ setGain(PRESETS[i], announce); return; }
  const hit = Math.abs(PRESETS[i] - S.gain) < 1e-6, els = gCards();
  reveal(false); lifts = 0;
  if(announce) say((hit ? "正解。" : "ちがいます。") + "ゲイン" + fmtG(S.gain), hit ? 2 : 1);
  const k = PRESETS.findIndex(p => Math.abs(p - S.gain) < 1e-6);
  if(!hit) els[i].classList.add("miss");
  if(k >= 0) els[k].classList.add("hit");
  setTimeout(() => els.forEach(e => e.classList.remove("miss", "hit")), 1600);
}
function stepPreset(d){
  const g = S.gain, eps = 1e-6;
  const t = d > 0 ? PRESETS.find(p => p > g + eps) : [...PRESETS].reverse().find(p => p < g - eps);
  if(t != null) setGain(t, true); else say(d > 0 ? "最大のカード" : "最小のカード", 1);
}

/* ---------- drawer / tools ---------- */
function drawer(open){ $("drawer").hidden = !open; $("gear").setAttribute("aria-expanded", String(open)); }
$("gear").onclick = () => drawer($("drawer").hidden);
$("shut").onclick = () => drawer(false);
function bindSeg(attr, key, parse){
  const btns = document.querySelectorAll(`[data-${attr}]`);
  btns.forEach(b => { b.onclick = () => { S[key] = parse(b.dataset[attr]); btns.forEach(o => o.setAttribute("aria-pressed", String(o === b))); layoutStage(); buildCards(); }; });
}
bindSeg("dir", "dir", x => parseInt(x, 10));
bindSeg("snd", "snd", x => x);
$("gslide").oninput = e => setGain(e.target.value, false);
$("gnum").oninput = e => { const v = parseFloat(e.target.value); if(Number.isFinite(v)) setGain(v, false); };
$("gnum").onchange = e => { e.target.blur(); refreshGain(); };
$("f0").onchange = e => { S.f0 = parseInt(e.target.value, 10); e.target.blur(); layoutStage(); };
$("clamp").onchange = e => { S.maxst = parseInt(e.target.value, 10); e.target.blur(); layoutStage(); buildCards(); };
$("edin").onchange = e => {
  const v = e.target.value.split(/[,\s、]+/).filter(Boolean).map(Number);
  const bad = v.length !== 5 || v.some(x => !Number.isFinite(x) || x < 0 || x > 1);
  e.target.classList.toggle("bad", bad); e.target.title = bad ? "0〜1の数を5つ" : "";
  if(bad) return;
  PRESETS = v.map(r2).sort((a, b) => a - b);
  try{ localStorage.setItem("cdw_presets", JSON.stringify(PRESETS)); }catch(_){}
  buildCards();
};
$("edrs").onclick = () => { PRESETS = DEF_PRESETS.slice(); try{ localStorage.removeItem("cdw_presets"); }catch(_){} $("edin").classList.remove("bad"); buildCards(); };
$("eye").onclick = () => { S.blind = !S.blind; $("eye").setAttribute("aria-pressed", String(S.blind)); $("eye").title = S.blind ? "画面を見る" : "画面を隠す"; $("blind").hidden = !S.blind; };
$("mute").onclick = () => { S.mute = !S.mute; $("mute").setAttribute("aria-pressed", String(S.mute)); $("mute").title = S.mute ? "音を出す" : "音を消す"; };

/* ---------- keyboard + voice（目を閉じたまま操作） ---------- */
const KEYS = [["← →", "カード"], ["Shift ←→", "±0.01"], ["1–5", "直接"], ["Space", "0にする"], ["Enter", "画面を隠す"], ["R", "あてる"], ["A", "答え"], ["D", "向き"], ["M", "鳴らし方"]];
$("keyhelp").innerHTML = KEYS.map(([k, t]) => `<kbd>${k}</kbd><span>${t}</span>`).join("");
let jaVoice = null;
function pickVoice(){ try{ jaVoice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)) || null; }catch(_){} }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function beep(n){
  if(!ctx) return;
  for(let i = 0; i < n; i++){
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.14;
    o.frequency.value = 1200; o.connect(g).connect(ctx.destination);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.12, t + 0.01); g.gain.linearRampToValueAtTime(0, t + 0.08);
    o.start(t); o.stop(t + 0.1);
  }
}
function say(text, fallbackBeeps = 1){
  if(S.mute) return;
  if("speechSynthesis" in window){
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; u.rate = 1.15; if(jaVoice) u.voice = jaVoice;
      speechSynthesis.speak(u); return;
    }catch(_){}
  }
  beep(fallbackBeeps);
}
document.addEventListener("click", e => { const b = e.target.closest && e.target.closest("button"); if(b && e.detail > 0) b.blur(); });
["pointerdown", "pointerup", "touchend"].forEach(t => document.addEventListener(t, initAudio, true));
document.addEventListener("keydown", e => {
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key, el = e.target;
  if(k === "Escape"){ drawer(false); return; }
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return;
  if(el.tagName === "BUTTON" && (k === " " || k === "Enter")) return;
  const ud = k === "ArrowUp" ? 1 : k === "ArrowDown" ? -1 : 0;
  initAudio();
  if(ud && el.id === "box"){ if(S.mode === "drag"){ touched = true; held = true; fall = null; target = clampv((target ?? h) + ud * 3, 0, MAXCM); } }
  else if(ud && el.id === "knob"){ if(!S.hidden) setGain(S.gain + ud * S.dir * 0.01, false); }
  else if(k === "ArrowRight" || ud > 0){ if(!S.hidden){ if(e.shiftKey) setGain(S.gain + 0.01, true); else stepPreset(1); } }
  else if(k === "ArrowLeft" || ud < 0){ if(!S.hidden){ if(e.shiftKey) setGain(S.gain - 0.01, true); else stepPreset(-1); } }
  else if(/^[1-5]$/.test(k)) pick(parseInt(k, 10) - 1, true);
  else if(k === " "){ zeroNow(); say("ゼロ"); }
  else if(k === "Enter"){ $("eye").click(); say(S.blind ? "目を閉じるモード" : "表示に戻しました"); }
  else if(k === "r" || k === "R") shuffle(true);
  else if(k === "a" || k === "A") reveal(true);
  else if(k === "d" || k === "D"){ document.querySelector(`[data-dir="${-S.dir}"]`).click(); say(S.dir > 0 ? "上げると高くなる" : "上げると低くなる"); }
  else if(k === "m" || k === "M"){ document.querySelector(`[data-snd="${S.snd === "moving" ? "always" : "moving"}"]`).click(); say(S.snd === "moving" ? "動いている間だけ" : "ずっと鳴らす"); }
  else return;
  e.preventDefault();
});

/* ---------- stage（px座標。大きさが変わるたびに描き直す） ---------- */
const G = { W: 0, desk: 0, top: 0, rg: 1, bx: 0, kx: 0, kw: 72, kh: 1, lit: -1 };
const yBox = cm => G.desk - 28 - clampv(cm, 0, MAXCM) / MAXCM * G.rg;                         // 箱の中心
const yNote = st => { const m = Math.min(S.maxst, Math.abs(st)) / S.maxst * G.rg; return S.dir > 0 ? G.desk - 28 - m : G.top + m; };
const isBlack = n => [1, 3, 6, 8, 10].includes(((n % 12) + 12) % 12);
function layoutStage(){
  const W = $("stagepanel").clientWidth, H = $("stagepanel").clientHeight;
  if(W < 10) return;
  const small = W < 480;
  G.W = W; G.desk = H - (H < 260 ? 18 : 52); G.top = H < 260 ? 60 : 96; G.rg = Math.max(40, G.desk - 28 - G.top);
  const span = Math.min(W / 2 - (small ? 96 : 130), 230); G.kw = small ? 52 : 76;
  G.bx = W / 2 - span + (small ? 6 : 10); G.kx = W / 2 + span - (small ? 2 : 20);
  $("stage").setAttribute("viewBox", `0 0 ${W} ${H}`);
  const rx = G.bx - (small ? 52 : 60);
  $("desk").innerHTML = `<path d="M${rx - 6} ${G.desk + 3}H${G.bx + 70}" stroke="var(--fg)" stroke-width="6" stroke-linecap="round" opacity=".75"/>`;
  // ものさし
  let s = `<path d="M${rx} ${G.desk}V${G.desk - G.rg}" stroke="var(--line)" stroke-width="2"/>`;
  for(let c = 0; c <= MAXCM; c++){
    const y = G.desk - c / MAXCM * G.rg, L = c % 10 === 0 ? 14 : c % 5 === 0 ? 9 : 5;
    s += `<path d="M${rx} ${y}h${-L}" stroke="var(--muted)" stroke-width="${c % 10 === 0 ? 2 : 1}"/>`;
    if(c % 10 === 0) s += `<text x="${rx - 18}" y="${y + 4}" text-anchor="end" font-size="12" font-family="var(--mono)" fill="var(--muted)">${c}</text>`;
  }
  s += `<text x="${rx - 18}" y="${G.desk - G.rg - 14}" text-anchor="end" font-size="12" fill="var(--h)">cm</text>`;
  $("ruler").innerHTML = s;
  // 鍵盤：1段＝1半音。最初の音の音名から白鍵・黒鍵を決める（上が高い音）
  const base = Math.round(69 + 12 * Math.log2(S.f0 / 440)), kh = G.rg / S.maxst, y1 = G.top - kh / 2, hh = G.rg + kh;
  let k = `<clipPath id="kclip"><rect x="${G.kx}" y="${y1}" width="${G.kw}" height="${hh}" rx="8"/></clipPath><g clip-path="url(#kclip)"><rect x="${G.kx}" y="${y1}" width="${G.kw}" height="${hh}" fill="var(--ivory)"/><rect id="litw" x="${G.kx}" width="${G.kw}" y="0" height="0" fill="var(--p)"/>`;
  for(let i = 0; i <= S.maxst; i++){
    const n = base + S.dir * i, y = yNote(S.dir * i);
    if(isBlack(n)) k += `<path d="M${G.kx} ${y}h${G.kw}" stroke="#8a94a3" stroke-width="1"/><rect class="key" data-i="${i}" x="${G.kx}" y="${y - kh / 2}" width="${G.kw * .6}" height="${kh}" rx="${Math.min(3, kh / 4)}" fill="var(--ebony)"/>`;
    else if(!isBlack(n + 1)) k += `<path d="M${G.kx} ${y - kh / 2}h${G.kw}" stroke="#8a94a3" stroke-width="1"/>`;
  }
  k += `</g><rect x="${G.kx}" y="${y1}" width="${G.kw}" height="${hh}" rx="8" fill="none" stroke="#8a94a3" stroke-width="1.5"/><text x="${G.kx + G.kw / 2}" y="${y1 - 8}" text-anchor="middle" font-size="12" fill="var(--p)">半音</text>`;
  $("keys").innerHTML = k; G.kh = kh; G.lit = -1;
  const gh = $("ghost");
  gh.setAttribute("x", G.bx - 42); gh.setAttribute("y", yBox(GOAL) - 28); gh.setAttribute("width", 84); gh.setAttribute("height", 56);
  $("qmark").setAttribute("x", G.kx - 34); $("qmark").setAttribute("y", G.top + G.rg / 2 + 22);
}
new ResizeObserver(layoutStage).observe($("stagepanel"));

let amp01 = 0, phase = 0;
function render(st, on, vh){
  if(!G.W) return;
  const vst = clampv(S.dir * S.gain * vh, -S.maxst, S.maxst), by = yBox(vh), py = yNote(vst), hid = S.hidden, nx = G.kx - 28;
  $("box").setAttribute("transform", `translate(${G.bx},${by})`);
  $("box").setAttribute("aria-valuenow", Math.round(h));
  $("hval").textContent = zeroed ? Math.round(h) : "";
  $("zring").setAttribute("stroke-dasharray", `${(clampv(zeroProgress, 0, 1) * 100).toFixed(1)} 101`);
  $("zring").style.display = zeroed || zeroProgress < 0.03 ? "none" : "";
  // 次の動作：点線の箱＝行き先、矢印＝動かす向き
  const quiet = S.mode === "demo" || !zeroed, reached = peak >= GOAL - 6, up = !reached || h < 3, sc = G.rg < 190 ? .55 : 1;
  $("ghost").style.display = quiet ? "none" : "";
  $("ghost").setAttribute("opacity", up ? ".75" : ".2");
  const showChev = !quiet && (up ? by - 66 - 50 * sc > yBox(GOAL) + 28 - 60 && h < GOAL - 14 : h > 6);
  $("chev").style.display = showChev ? "" : "none";
  if(showChev) $("chev").setAttribute("transform", up ? `translate(${G.bx},${by - 66}) scale(${sc})` : `translate(${G.bx},${by + 46}) scale(${sc},${-sc})`);
  // 弦：鳴ると振れる。音が高いほど波が細かい
  amp01 += ((on ? 1 : 0) - amp01) * 0.18; if(!CALM) phase += 0.22;
  const x1 = G.bx + 44, x2 = nx - 24, cyc = Math.min(26, 4 * Math.pow(2, vst / 12)), N = 260;
  let d = "";
  for(let i = 0; i <= N; i++){ const t = i / N; d += (i ? "L" : "M") + (x1 + (x2 - x1) * t).toFixed(1) + " " + (by + (py - by) * t + Math.sin(Math.PI * t) * 11 * amp01 * Math.sin(2 * Math.PI * cyc * t - phase)).toFixed(1); }
  $("string").setAttribute("d", d); $("string").setAttribute("opacity", on ? 1 : .45);
  $("pmark").setAttribute("transform", `translate(${nx},${py})`);
  $("pval").textContent = Math.abs(st) < 0.05 ? "" : (st > 0 ? "+" : "−") + Math.abs(st).toFixed(1);
  // 鍵盤の光
  const li = hid || !on ? -1 : Math.round(Math.abs(vst));
  if(li !== G.lit){
    G.lit = li;
    let blackHit = false;
    document.querySelectorAll("#keys .key").forEach(r => { const m = +r.dataset.i === li; if(m) blackHit = true; r.style.fill = m ? "var(--p)" : ""; });
    const w = $("litw"); w.setAttribute("height", li < 0 || blackHit ? 0 : G.kh); if(li >= 0) w.setAttribute("y", yNote(S.dir * li) - G.kh / 2);
  }
  // つまみ：点線の箱まで上げたとき、音が届くところ
  const ky = yNote(S.dir * Math.min(S.maxst, GOAL * S.gain)), rc = $("reach");
  $("knob").setAttribute("transform", `translate(${G.kx + G.kw + 2},${ky})`);
  $("knob").setAttribute("aria-valuenow", fmtG(S.gain));
  rc.setAttribute("x1", G.bx + 50); rc.setAttribute("y1", yBox(GOAL)); rc.setAttribute("x2", G.kx - 4); rc.setAttribute("y2", ky);
  ["pmark", "string", "reach", "knob"].forEach(id => { $(id).style.display = hid ? "none" : ""; });
  $("qmark").style.display = hid ? "" : "none";
}

/* ---------- つかんで動かす ---------- */
let held = false, target = null, fall = null, grabDy = 0, knobOn = false;
const svgY = e => e.clientY - $("stage").getBoundingClientRect().top;
$("box").addEventListener("pointerdown", e => {
  if(S.mode === "demo") selectMode("drag");
  if(S.mode !== "drag") return;
  e.preventDefault(); $("box").setPointerCapture(e.pointerId);
  touched = true; held = true; fall = null; target = h; grabDy = svgY(e) - yBox(h);
  $("stagepanel").classList.add("held");
});
$("box").addEventListener("pointermove", e => { if(held && $("box").hasPointerCapture(e.pointerId)) target = clampv((G.desk - 28 - (svgY(e) - grabDy)) / G.rg * MAXCM, 0, MAXCM); });
function release(){ if(!held) return; held = false; target = null; fall = h > 0 ? { t: performance.now(), h } : null; $("stagepanel").classList.remove("held"); }
["pointerup", "pointercancel", "blur"].forEach(t => $("box").addEventListener(t, release));
function dragStep(now){
  const prev = h;
  if(held && target != null){ h += (target - h) * 0.35; if(Math.abs(target - h) < 0.05) h = target; }
  else if(fall){ const t = (now - fall.t) / (180 + fall.h * 14); h = t >= 1 ? 0 : fall.h * (1 - t * t); if(t >= 1) fall = null; }   // 手を離すと机に戻る（速さはゲインによらず同じ）
  else h = 0;
  moving = Math.abs(h - prev) > 0.04; if(moving) gateUntil = now + 160;
}
$("knob").addEventListener("pointerdown", e => { if(S.hidden) return; e.preventDefault(); knobOn = true; $("knob").setPointerCapture(e.pointerId); });
$("knob").addEventListener("pointermove", e => {
  if(!knobOn) return;
  const y = svgY(e), st = clampv((S.dir > 0 ? G.desk - 28 - y : y - G.top) / G.rg, 0, 1) * S.maxst;
  setGain(st / GOAL, false);
});
["pointerup", "pointercancel"].forEach(t => $("knob").addEventListener(t, () => { knobOn = false; }));

/* ---------- 一言だけの合図 ---------- */
let lastHint = null;
const live = () => !!ctx && ctx.state === "running";
function guide(){
  let t = "", next = false;
  if(errMsg) t = errMsg;
  else if(busy) t = "";
  else if(!zeroed) t = S.mode === "phone" ? "スマホを机に置く" : S.mode === "above" ? "手をかざして止める" : "手を机で止める";
  else if(S.mode === "demo") t = live() || S.mute ? "" : "画面を押すと音が出る";
  else if(h < 3 && lifts > 0){ t = S.hidden ? "どのカード？" : "カードを変えてもう一度"; next = !S.hidden; }
  else if(h < 3 && !touched && S.mode === "drag") t = "つかんで上げる";
  if(t !== lastHint){ lastHint = t; $("hint").textContent = t; $("hint").hidden = !t; $("hint").classList.toggle("err", !!errMsg); }
  const cur = PRESETS.findIndex(p => Math.abs(p - S.gain) < 1e-6);
  gCards().forEach((c, i) => c.classList.toggle("next", next && lifts === 1 && i === (cur === 4 ? 0 : 4)));
  $("mute").classList.toggle("call", S.mode === "demo" && !S.mute && !live());
}

/* ---------- trial log ---------- */
const rows = [];
let lift = null;
const gCell = r => r.hidden && !r.revealed ? "?" : fmtG(r.gain);
function renderLog(){
  $("logb").innerHTML = rows.slice().reverse().map(r => `<tr><td>${r.n}</td><td>${MODE[r.mode]}</td><td>${gCell(r)}</td><td>${r.dir > 0 ? "高く" : "低く"}</td><td>${r.peak.toFixed(1)}</td><td>${r.dur.toFixed(1)}</td></tr>`).join("");
  $("logt").textContent = `記録 ${rows.length}回`;
}
function revealLog(){ rows.forEach(r => { if(r.hidden) r.revealed = true; }); if(lift) lift.revealed = true; renderLog(); }
function trackLift(now){
  if(!zeroed){ lift = null; return; }
  if(!lift){ if(h > 5) lift = { t0: now, peak: h, mode: S.mode, gain: S.gain, hidden: S.hidden, dir: S.dir, f0: S.f0, maxst: S.maxst, revealed: false }; return; }
  lift.peak = Math.max(lift.peak, h);
  if(h < 2){
    const dur = (now - lift.t0) / 1000;
    if(dur >= 0.3){ rows.push({ n: rows.length + 1, ...lift, dur }); renderLog(); }
    lift = null;
  }
}
$("clear").onclick = () => { rows.length = 0; renderLog(); };
$("copy").onclick = async () => {
  const head = ["trial", "method", "g_st_per_cm", "direction", "f0_hz", "clamp_st", "peak_h_cm", "duration_s"];
  const csv = [head, ...rows.map(r => [r.n, MODE[r.mode], gCell(r) === "?" ? "hidden" : r.gain, r.dir > 0 ? "+" : "-", r.f0, r.maxst, r.peak.toFixed(1), r.dur.toFixed(2)])].map(a => a.join(",")).join("\n");
  let ok = false;
  try{ await navigator.clipboard.writeText(csv); ok = true; }
  catch(_){
    try{ const ta = document.createElement("textarea"); ta.value = csv; ta.style.cssText = "position:fixed;left:-9999px;top:0"; document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); }catch(__){}
  }
  const b = $("copy"); b.textContent = ok ? "コピーしました" : "コピーできません";
  setTimeout(() => { b.textContent = "CSVをコピー"; }, 1200);
};

/* ---------- audio ---------- */
let ctx = null, osc = null, amp = null;
function initAudio(){
  const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
  if(!ctx){ ctx = new AC(); osc = ctx.createOscillator(); osc.type = "sine"; osc.frequency.value = S.f0;
    amp = ctx.createGain(); amp.gain.value = 0; osc.connect(amp).connect(ctx.destination); osc.start(); }
  if(ctx.state !== "running") ctx.resume();
}
const T0 = performance.now();
function tick(){
  const now = performance.now();
  if(S.mode === "demo") demoStep(now); else if(S.mode === "drag") dragStep(now);
  if(zeroed){ peak = Math.max(peak, h); if(h < 3 && peak > 5){ if(peak > 15) lifts++; peak = 0; } }
  trackLift(now);
  const st = clampv(S.dir * S.gain * h, -S.maxst, S.maxst);
  const on = zeroed && (S.mode !== "drag" || touched) && (S.snd === "always" || moving || now < gateUntil);
  if(ctx){ const t = ctx.currentTime, snd = on && !S.mute; osc.frequency.setTargetAtTime(S.f0 * Math.pow(2, st / 12), t, 0.012); amp.gain.setTargetAtTime(snd ? 0.2 : 0, t, snd ? 0.02 : 0.07); }
  // 触る前は、箱が少しだけ浮いて「持ち上げられる」ことを見せる
  let vh = h;
  if(S.mode === "drag" && !touched && !CALM){ const t = ((now - T0) / 2400) % 1; if(t > 0.5) vh = 4 * Math.pow(Math.sin(Math.PI * (t - 0.5) * 2), 2); }
  render(st, on, vh);
  guide();
  requestAnimationFrame(tick);
}
document.addEventListener("visibilitychange", () => { if(document.hidden && amp) amp.gain.setTargetAtTime(0, ctx.currentTime, 0.03); });

let zeroNow = () => {};
$("zero").onclick = () => zeroNow();
const showErr = m => { errMsg = m; busy = false; };

/* ---------- layout per mode ---------- */
function applyLayout(){
  const cam = S.mode === "cam" || S.mode === "above";
  $("live").classList.toggle("cam", cam);
  $("stagepanel").classList.toggle("grab", S.mode === "drag" || S.mode === "demo");
  $("flip").hidden = !TOUCH || !cam;
  $("zero").hidden = !(cam || S.mode === "phone");
}
function find(text, show = true){ $("findt").textContent = text; $("find").hidden = !show; }

/* ---------- demo ---------- */
let demoT0 = 0;
function demoStep(now){
  const t = ((now - demoT0) / 1000) % 4.6;
  const e = x => 0.5 - 0.5 * Math.cos(Math.PI * clampv(x, 0, 1));
  const prev = h;
  h = t < 0.5 ? 0 : t < 2.0 ? 30 * e((t - 0.5) / 1.5) : t < 2.8 ? 30 : t < 4.0 ? 30 * (1 - e((t - 2.8) / 1.2)) : 0;
  moving = Math.abs(h - prev) > 0.05; if(moving) gateUntil = now + 120;
}

/* ---------- camera ---------- */
let camToken = 0;
let stream = null, landmarker = null, camRaf = 0, cs = null;
async function startCam(){
  const token = ++camToken; busy = true; zeroed = false; $("camwrap").classList.add("lost"); find("カメラを準備中");
  const above = S.mode === "above";
  const facing = above ? S.aboveFacing : S.facing;
  let st;
  try{ st = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: facing }, audio: false }); }
  catch(e){ if(token === camToken){ find("", false); showErr("カメラを許可してください"); } return; }
  if(token !== camToken){ st.getTracks().forEach(t => t.stop()); return; }
  stream = st;
  $("camwrap").classList.toggle("mirror", facing === "user");
  const video = $("video"); video.srcObject = stream; try{ await video.play(); }catch(_){}
  if(!landmarker){
    try{
      const vision = await import(MP + "/vision_bundle.mjs");
      const fs = await vision.FilesetResolver.forVisionTasks(MP + "/wasm");
      const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: "VIDEO", numHands: 1 });
      try{ landmarker = await vision.HandLandmarker.createFromOptions(fs, opts("GPU")); }
      catch(_){ landmarker = await vision.HandLandmarker.createFromOptions(fs, opts("CPU")); }
    }catch(e){ if(token === camToken){ find("", false); showErr("手の検出を読み込めません。通信を確認してください"); } return; }
  }
  if(token !== camToken) return;
  busy = false;
  cs = { y0: null, k: null, y: null, palm: null, d: null, d0: null, hist: [], seen: 0, vt: -1, ph: 0, pt: 0 };
  zeroNow = () => {
    if(!cs) return;
    if(S.mode === "above"){ if(cs.d == null) return; cs.d0 = cs.d; }
    else { if(cs.y == null) return; cs.y0 = cs.y; cs.k = 9.5 / cs.palm; }
    zeroed = true; h = 0; peak = 0;
  };
  camLoop();
}
function camLoop(){
  const video = $("video"), cv = $("overlay"), c = cv.getContext("2d");
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--h").trim();
  const step = () => {
    if(!stream || !cs) return;
    const W = video.videoWidth, H = video.videoHeight;
    if(W && video.currentTime !== cs.vt){
      cs.vt = video.currentTime;
      if(cv.width !== W){ cv.width = W; cv.height = H; }
      const now = performance.now();
      const res = landmarker.detectForVideo(video, now);
      const lm = res.landmarks?.[0], wl = res.worldLandmarks?.[0];
      const above = S.mode === "above";
      c.clearRect(0, 0, W, H);
      if(lm){
        cs.seen = now;
        const PALM = [0, 1, 5, 9, 13, 17];
        let cx = 0, cy = 0; PALM.forEach(i => { cx += lm[i].x; cy += lm[i].y; }); cx = cx / PALM.length * W; cy = cy / PALM.length * H;
        const palm = Math.hypot((lm[0].x - lm[9].x) * W, (lm[0].y - lm[9].y) * H);
        cs.y = cs.y == null ? cy : cs.y + 0.55 * (cy - cs.y);
        cs.palm = cs.palm ? cs.palm + 0.1 * (palm - cs.palm) : palm;
        if(above && wl){
          // 写った手の大きさ（px）と実寸の手の形（m）を比べて、カメラからの距離を出す
          let wx = 0, wy = 0; PALM.forEach(i => { wx += wl[i].x; wy += wl[i].y; }); wx /= PALM.length; wy /= PALM.length;
          let si = 0, sw = 0;
          PALM.forEach(i => { si += Math.hypot(lm[i].x * W - cx, lm[i].y * H - cy); sw += Math.hypot(wl[i].x - wx, wl[i].y - wy); });
          if(sw > 0 && si > 0){
            const f = 0.74 * Math.max(W, H);   // 一般的なスマホカメラの画角（約70度）を仮定
            const d = f * sw / si;            // m
            cs.d = cs.d == null ? d : cs.d + 0.4 * (d - cs.d);
          }
        }
        const q = above ? (cs.d == null ? null : cs.d * 100) : cs.y;
        if(!zeroed){
          if(q != null){
            cs.hist.push({ t: now, y: q }); while(now - cs.hist[0].t > 1000) cs.hist.shift();
            const ys = cs.hist.map(p => p.y), span = Math.max(...ys) - Math.min(...ys);
            const still = above ? span < 0.8 : span < cs.palm * 0.06;
            if(!still) cs.hist = cs.hist.slice(-1);
            zeroProgress = still ? (now - cs.hist[0].t) / 1000 : 0;
            if(still && zeroProgress >= 0.95) zeroNow();
          }
        } else {
          h = above ? Math.max(0, (cs.d - cs.d0) * 100) : Math.max(0, (cs.y0 - cs.y) * cs.k);
          const dt = (now - cs.pt) / 1000;
          if(dt > 0){ moving = Math.abs(h - cs.ph) / dt > 4; if(moving) gateUntil = now + 180; }
          cs.ph = h; cs.pt = now;
        }
        drawOverlay(c, W, H, cx, cy, accent, above);
      }
      const lost = now - cs.seen > 400;
      $("camwrap").classList.toggle("lost", lost); find("手を映す", lost);
      if(lost){ moving = false; if(!zeroed) zeroProgress = 0; }
    }
    camRaf = requestAnimationFrame(step);
  };
  step();
}
// 映像の中の手に直接描く：輪＝止まるのを待つ、実線＝机、点線と矢印＝行き先
function drawOverlay(c, W, H, cx, cy, accent, above){
  const R = Math.max(24, (cs.palm || 60) * (above ? 0.9 : 0.6));
  const arc = (r, frac, col, w, dash = []) => { c.setLineDash(dash); c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); c.stroke(); c.setLineDash([]); };
  const line = (y, dash) => { c.setLineDash(dash); for(const [col, w] of [["#0008", 8], [accent, 4]]){ c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(W * .06, y); c.lineTo(W * .94, y); c.stroke(); } c.setLineDash([]); };
  c.lineCap = "round"; c.lineJoin = "round";
  if(!zeroed){ arc(R, 1, "#fff8", 8); arc(R, clampv(zeroProgress, 0, 1), "#6ccb93", 8); return; }
  arc(R, 1, "#0008", 9); arc(R, 1, accent, 5);
  const up = peak < GOAL - 6 || h < 3;
  if(above){ if(up && cs.d0) arc(R * cs.d / (cs.d0 + GOAL / 100), 1, "#fff", 4, [8, 12]); return; }   // 点線の輪＝30cm離れたときの手の大きさ
  line(cs.y0, []);
  const gy = cs.y0 - GOAL / cs.k;
  if(up && gy > 8) line(gy, [4, 14]);
  if(up ? h < GOAL - 8 : h > 4){
    const s = up ? -1 : 1, t = CALM ? 0 : Math.floor(performance.now() / 350 % 3);
    for(let i = 0; i < 3; i++){
      const y = cy + s * (R + 22 + i * 22); c.globalAlpha = t === i ? 1 : .35;
      for(const [col, w] of [["#0008", 10], ["#fff", 6]]){ c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(cx - 18, y - s * 8); c.lineTo(cx, y + s * 6); c.lineTo(cx + 18, y - s * 8); c.stroke(); }
    }
    c.globalAlpha = 1;
  }
}
$("flip").onclick = () => {
  if(S.mode === "above") S.aboveFacing = S.aboveFacing === "user" ? "environment" : "user";
  else S.facing = S.facing === "user" ? "environment" : "user";
  stopAll(); begin();
};

/* ---------- phone sensor ---------- */
let ph = null;
function startPhone(){
  zeroed = false; h = 0;
  ph = { v: 0, lastT: null, g: null, win: [], segStart: 0, wasStill: true, stillSince: performance.now() };
  zeroNow = () => { h = 0; if(ph) ph.v = 0; zeroed = true; peak = 0; };
  const DME = window.DeviceMotionEvent;
  if(!DME){ showErr("動きのセンサーがありません。カメラを使ってください"); return; }
  const attach = () => window.addEventListener("devicemotion", onMotion);
  if(typeof DME.requestPermission === "function"){
    DME.requestPermission().then(r => r === "granted" ? attach() : showErr("動きのセンサーを許可してください")).catch(() => showErr("動きのセンサーを許可してください"));
  } else attach();
}
function onMotion(e){
  const aig = e.accelerationIncludingGravity; if(!aig || aig.x == null || !ph) return;
  const now = performance.now(), g = [aig.x, aig.y, aig.z];
  if(ph.lastT === null){ ph.lastT = now; ph.g = g.slice(); return; }
  const dt = (now - ph.lastT) / 1000; ph.lastT = now; if(dt <= 0 || dt > 0.1) return;
  const k = 1 - Math.exp(-dt / 0.6); for(let i = 0; i < 3; i++) ph.g[i] += k * (g[i] - ph.g[i]);
  const gm = Math.hypot(...ph.g) || 9.81, u = ph.g.map(x => x / gm);
  const acc = e.acceleration;
  const aUp = (acc && acc.x != null) ? acc.x * u[0] + acc.y * u[1] + acc.z * u[2] : g[0] * u[0] + g[1] * u[1] + g[2] * u[2] - gm;
  ph.win.push({ t: now, a: Math.abs(aUp) }); while(now - ph.win[0].t > 250) ph.win.shift();
  const still = Math.max(...ph.win.map(w => w.a)) < 0.2;
  if(still){
    if(!ph.wasStill){ if(h - ph.segStart < -3) h = 0; ph.stillSince = now; }
    ph.v = 0;
    if(!zeroed){ zeroProgress = (now - ph.stillSince) / 700; if(zeroProgress >= 1) zeroNow(); }
  } else {
    if(ph.wasStill) ph.segStart = h;
    const a = Math.abs(aUp) < 0.05 ? 0 : aUp;
    ph.v += a * dt; ph.v *= (1 - 0.3 * dt); h += ph.v * dt * 100;
    if(h < 0){ h = 0; if(ph.v < 0) ph.v = 0; } if(h > 80) h = 80;
    if(!zeroed){ ph.stillSince = now; zeroProgress = 0; }
  }
  ph.wasStill = still;
  moving = !still && Math.abs(ph.v) > 0.03; if(moving) gateUntil = now + 150;
}

/* ---------- flow ---------- */
function stopAll(){
  camToken++;
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  cancelAnimationFrame(camRaf);
  $("video").srcObject = null;
  const cv = $("overlay"); cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
  window.removeEventListener("devicemotion", onMotion); ph = null; cs = null;
  zeroed = false; h = 0; moving = false; lifts = 0; peak = 0; zeroProgress = 0; errMsg = ""; busy = false; held = false; target = null; fall = null;
  $("stagepanel").classList.remove("held");
  zeroNow = () => {}; lift = null;
}
function begin(){
  applyLayout();
  if(S.mode === "cam" || S.mode === "above") startCam();
  else if(S.mode === "phone") startPhone();
  else { zeroed = true; demoT0 = performance.now(); }
}
// 動かし方を押すと、その場で始まる（押した操作でカメラ・センサーの許可を求められる）
const modeBtns = document.querySelectorAll("[data-mode]");
function selectMode(m){
  modeBtns.forEach(o => o.setAttribute("aria-pressed", String(o.dataset.mode === m)));
  stopAll(); S.mode = m; begin();
}
modeBtns.forEach(b => { b.onclick = () => { initAudio(); selectMode(b.dataset.mode); }; });
layoutStage(); buildCards();
selectMode(location.hash === "#demo" ? "demo" : "drag");
requestAnimationFrame(tick);
</script>
</body>
</html>
